# scour service configuration.
#
# Everything here is the built-in default, so an empty file behaves the same
# way. Uncomment what you want to change.
#
# Settings resolve in this order, and a flag always wins:
#   1. command line flags
#   2. environment (SCOUR_CONFIG, SCOUR_LISTEN, SCOUR_DATA_DIR, SCOUR_CACHE_DIR)
#   3. this file
#   4. built-in defaults

[server]
listen  = "127.0.0.1:8080"
mcp     = true
metrics = "/metrics"

# Auth is off while listen is on loopback. Before binding an external address,
# write a token to a file readable only by the scour user and point at it here:
#
#   install -o scour -g scour -m 0400 /dev/null /etc/scour/token
#   head -c 32 /dev/urandom | base64 > /etc/scour/token
#
# token_file = "/etc/scour/token"

[crawl]
concurrency   = 8      # in-flight requests across all hosts
rate          = "1s"   # delay between requests to one host
timeout       = "30s"
max_size      = "10MB"
robots        = true
content_types = ["html"]
depth         = 10

[browser]
enabled = true
policy  = "auto"       # never, auto or always
pool    = 2
timeout = "45s"

[model]
scorer    = "bayes"    # bayes or embed
matcher   = "heuristic"
holdout   = 0.2
min_score = 0.1

# Under systemd these come from StateDirectory and CacheDirectory, so they are
# only worth setting if you are not using the shipped unit.
# [paths]
# data  = "/var/lib/scour"
# cache = "/var/cache/scour"

# Be politer to a fragile server than the global default, or faster against one
# you own. The first block whose host matches wins.
# [[host]]
# host = "example.com"
# rate = "5s"
# concurrency = 2
