<!-- A real React single-page app. The shell carries no content at all: the
     headline, byline and body are created by React from JSON fetched after
     load, so a plain fetch sees an empty div and only a rendered page has
     anything to extract. This is the case the browser escalation exists for,
     and a harder one than a page whose content sits in a script string,
     because here the text is a second request away.

     React is vendored under /vendor so the fixture works with no network. No
     JSX, so there is no build step: React.createElement is the API. -->
<html lang="en"><head>
<meta charset="utf-8">
<title>The Gazette, live</title>
<link rel="canonical" href="{{BASE}}/app/">
</head><body>
<div id="root"></div>
<noscript>This page is written by script. <a href="/news/">The plain news index</a> is not.</noscript>
<script src="/vendor/react.js"></script>
<script src="/vendor/react-dom.js"></script>
<script src="./app.js"></script>
<nav class="crosslinks">
  <a href="{{BASE}}/search?q=harbour">Search (absolute)</a>
  <a href="/feeds/rss.xml">Feed (root-relative)</a>
  <a href="../files/report.pdf">The report PDF (relative)</a>
</nav>
</body></html>
