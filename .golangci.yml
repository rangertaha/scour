version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - goconst
    - misspell
    - nilerr
    - noctx
    - prealloc
    - revive
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
  settings:
    errcheck:
      check-type-assertions: true
    goconst:
      ignore-tests: true
    staticcheck:
      # QF1001 rewrites a negated range test through De Morgan's law. Both
      # places it fires read as "not a letter" and "not alphanumeric", and the
      # rewritten form says the same thing in a way nobody parses at a glance.
      # QF is the quickfix category: suggestions, not correctness.
      checks:
        - all
        - -QF1001
    govet:
      enable-all: true
      disable:
        - fieldalignment
        # shadow flagged 50 sites and every one of them was `err`, 37 in tests.
        # `if err := f(); err != nil` inside a function that already has an err
        # is how Go is written, and go vet keeps this analyzer experimental and
        # off by default for that reason. Left on it reports a style nobody is
        # going to change, which is how a gate stops being read.
        - shadow
    revive:
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - goconst
          - unparam
          # A test builds a slice whose size it already knows, and preallocating
          # it saves an allocation nobody is measuring in code nobody ships.
          - prealloc
      # internal/wom carries a few exported names that only its own tests and
      # one caller use yet. It is scour's code and is linted like the rest;
      # this narrow exemption is for the layered engine's public surface, not
      # a blanket pass.
      - path: internal/wom/
        linters:
          - unparam
          - unused
          - wastedassign
      # goconst earns its place on domain vocabulary, and it found real drift
      # there: the content shorthands are constants now, and the CLI's verdict
      # words are the store's own Label values rather than three copies of
      # "valid". What is left in these two packages is not that. In store the
      # repeats are gorm column names and where-clause fragments, already tied
      # to the struct tags they address; naming them turns a readable query into
      # tx.Where(whereItemID, id) and couples nothing that was not coupled. In
      # cli they are flag names and the usage placeholder <name>, each already
      # bound to the flag that declares it.
      - path: internal/(store|cli)/
        linters:
          - goconst

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/rangertaha/scour
