<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" role="img"
     aria-label="The resource tree. Aliases, properties, records and the model hang off an item; targets, types, the frontier and runs hang off a job; runs and nodes are top level collections. Every path is nouns.">
  <style>
    .l{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1f2328}
    .u{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1f2328}
    .v{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#0969da}
    .n{font:11px -apple-system,system-ui,sans-serif;fill:#57606a}
    .h{font:600 12px -apple-system,system-ui,sans-serif;fill:#1f2328}
    .t{stroke:#57606a;stroke-width:1.1;fill:none;opacity:.55}
    .box{fill:#f6f8fa;stroke:#57606a;stroke-width:1.4;rx:6}
    .sep{stroke:#d0d7de;stroke-width:1}
    @media (prefers-color-scheme:dark){
      .l,.u,.h{fill:#e6edf3} .v{fill:#58a6ff} .n{fill:#8b949e} .t{stroke:#8b949e}
      .box{fill:#21262d;stroke:#8b949e} .sep{stroke:#30363d}}
  </style>

  <text class="n" x="440" y="24" text-anchor="middle">ownership decides nesting, and nothing is nested for any other reason</text>

  <text class="h" x="40" y="56">what an item owns</text>
  <text class="v" x="40" y="82">/v1/items/<tspan class="u">{item}</tspan></text>
  <path class="t" d="M52,90 V112 H68"/>
  <text class="u" x="72" y="116">aliases/{word}</text>
  <path class="t" d="M52,90 V142 H68"/>
  <text class="u" x="72" y="146">properties/{prop}</text>
  <path class="t" d="M84,150 V172 H100"/>
  <text class="u" x="104" y="176">labels/{word}</text>
  <path class="t" d="M52,90 V202 H68"/>
  <text class="u" x="72" y="206">records/{id}</text>
  <path class="t" d="M52,90 V232 H68"/>
  <text class="u" x="72" y="236">model</text>
  <path class="t" d="M84,240 V262 H100"/>
  <text class="u" x="104" y="266">rules</text>
  <path class="t" d="M84,240 V292 H100"/>
  <text class="u" x="104" y="296">runs</text>

  <line class="sep" x1="440" y1="46" x2="440" y2="310"/>

  <text class="h" x="480" y="56">what a job owns</text>
  <text class="v" x="480" y="82">/v1/jobs/<tspan class="u">{job}</tspan></text>
  <path class="t" d="M492,90 V112 H508"/>
  <text class="u" x="512" y="116">targets/{id}</text>
  <path class="t" d="M492,90 V142 H508"/>
  <text class="u" x="512" y="146">types/{type}</text>
  <path class="t" d="M492,90 V172 H508"/>
  <text class="u" x="512" y="176">frontier</text>
  <path class="t" d="M492,90 V202 H508"/>
  <text class="u" x="512" y="206">runs</text>

  <text class="h" x="480" y="242">and the engine itself</text>
  <text class="v" x="480" y="266">/v1/runs/<tspan class="u">{id}</tspan>/log</text>
  <text class="v" x="480" y="290">/v1/nodes/<tspan class="u">{node}</tspan></text>

  <rect class="box" x="40" y="326" width="800" height="54"/>
  <text class="l" x="60" y="348">GET</text>
  <text class="n" x="104" y="348">read it</text>
  <text class="l" x="196" y="348">POST</text>
  <text class="n" x="248" y="348">add a member</text>
  <text class="l" x="368" y="348">PATCH</text>
  <text class="n" x="430" y="348">change some fields</text>
  <text class="l" x="576" y="348">PUT</text>
  <text class="n" x="620" y="348">declare a whole set</text>
  <text class="l" x="762" y="348">DELETE</text>
  <text class="n" x="60" y="368">Every path is nouns and no path ends in a verb: the method says what is being done, and the body says with what.</text>

  <text class="n" x="440" y="404" text-anchor="middle">The URL is the relationship diagram, so a path that reads oddly is usually a modelling mistake rather than a naming one.</text>
</svg>
