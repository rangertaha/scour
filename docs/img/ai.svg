<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" role="img"
     aria-label="The parts that want a model's judgement ask through a cache keyed by the question, which reaches a provider behind a one-method interface. A local model and a hosted one are the same thing to the rest of scour.">
  <style>
    .b{fill:#f6f8fa;stroke:#57606a;stroke-width:1.5;rx:6}
    .s{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5;rx:6}
    .l{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1f2328}
    .i{font:10.5px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#57606a}
    .n{font:11px -apple-system,system-ui,sans-serif;fill:#57606a}
    .f{stroke:#57606a;stroke-width:1.5;fill:none;marker-end:url(#a)}
    .ah{fill:#57606a}
    @media (prefers-color-scheme:dark){
      .b{fill:#21262d;stroke:#8b949e} .s{fill:#0d2d4d;stroke:#58a6ff}
      .l{fill:#e6edf3} .i,.n{fill:#8b949e} .f{stroke:#8b949e} .ah{fill:#8b949e}}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <text class="n" x="440" y="24" text-anchor="middle">the package knows nothing about crawling or extraction: it answers one question, and only that one</text>

  <rect class="b" x="24" y="58" width="176" height="52"/>
  <text class="l" x="112" y="79" text-anchor="middle">matcher llm</text>
  <text class="i" x="112" y="96" text-anchor="middle">is this node that field?</text>

  <rect class="b" x="24" y="132" width="176" height="52"/>
  <text class="l" x="112" y="153" text-anchor="middle">classify llm</text>
  <text class="i" x="112" y="170" text-anchor="middle">what is this page?</text>

  <path class="f" d="M200,84  C232,84  222,108 250,112"/>
  <path class="f" d="M200,158 C232,158 222,140 250,136"/>

  <rect class="s" x="254" y="90" width="180" height="70"/>
  <text class="l" x="344" y="114" text-anchor="middle">judgements</text>
  <text class="i" x="344" y="133" text-anchor="middle">keyed by the question,</text>
  <text class="i" x="344" y="149" text-anchor="middle">so it is paid for once</text>

  <path class="f" d="M434,125 H470"/>

  <rect class="b" x="474" y="90" width="186" height="70"/>
  <text class="l" x="567" y="114" text-anchor="middle">Provider</text>
  <text class="i" x="567" y="133" text-anchor="middle">JSON(ctx, Request)</text>
  <text class="i" x="567" y="149" text-anchor="middle">-&gt; []byte</text>

  <path class="f" d="M660,112 C692,112 682,90 710,86"/>
  <path class="f" d="M660,138 C692,138 682,158 710,162"/>

  <rect class="b" x="714" y="60" width="146" height="52"/>
  <text class="l" x="787" y="81" text-anchor="middle">ollama</text>
  <text class="i" x="787" y="98" text-anchor="middle">local</text>

  <rect class="b" x="714" y="136" width="146" height="52"/>
  <text class="l" x="787" y="157" text-anchor="middle">anthropic</text>
  <text class="i" x="787" y="174" text-anchor="middle">hosted</text>

  <text class="n" x="440" y="228" text-anchor="middle">"Given this prompt, return JSON matching this schema." A caller that wanted prose would be asking the wrong package.</text>

  <text class="n" x="440" y="266" text-anchor="middle">Keeping the interface this narrow is what lets a local model and a hosted one be the same thing to everything else,</text>
  <text class="n" x="440" y="284" text-anchor="middle">and what keeps the expensive, unpredictable part of the system behind a seam that can be tested with a stub.</text>

  <text class="n" x="440" y="322" text-anchor="middle">The raw bytes come back rather than a decoded value, so the caller owns the shape it expects and a provider</text>
  <text class="n" x="440" y="340" text-anchor="middle">needs no change when a new kind of question is asked.</text>
</svg>
