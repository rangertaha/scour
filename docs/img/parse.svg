<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" role="img"
     aria-label="HTML, XML, RSS, JSON, JavaScript, CSS and PDF bodies all become subtrees of one graph, shaped root to domain to uri to document to content.">
  <style>
    .b{fill:#f6f8fa;stroke:#57606a;stroke-width:1.5;rx:6}
    .s{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5;rx:6}
    .l{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1f2328}
    .m{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1f2328}
    .i{font:10.5px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#57606a}
    .n{font:11px -apple-system,system-ui,sans-serif;fill:#57606a}
    .f{stroke:#57606a;stroke-width:1.2;fill:none;marker-end:url(#a)}
    .t{stroke:#0969da;stroke-width:1.2;fill:none;opacity:.6}
    .ah{fill:#57606a}
    @media (prefers-color-scheme:dark){
      .b{fill:#21262d;stroke:#8b949e} .s{fill:#0d2d4d;stroke:#58a6ff}
      .l,.m{fill:#e6edf3} .i,.n{fill:#8b949e} .f{stroke:#8b949e} .t{stroke:#58a6ff} .ah{fill:#8b949e}}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <text class="n" x="440" y="22" text-anchor="middle">a whole crawl of a site is traversed as one structure, not as a pile of independent documents</text>

  <rect class="b" x="24" y="52" width="140" height="30"/>
  <text class="m" x="94" y="72" text-anchor="middle">html</text>
  <rect class="b" x="24" y="92" width="140" height="30"/>
  <text class="m" x="94" y="112" text-anchor="middle">xml · rss · atom</text>
  <rect class="b" x="24" y="132" width="140" height="30"/>
  <text class="m" x="94" y="152" text-anchor="middle">json</text>
  <rect class="b" x="24" y="172" width="140" height="30"/>
  <text class="m" x="94" y="192" text-anchor="middle">javascript</text>
  <rect class="b" x="24" y="212" width="140" height="30"/>
  <text class="m" x="94" y="232" text-anchor="middle">css</text>
  <rect class="b" x="24" y="252" width="140" height="30"/>
  <text class="m" x="94" y="272" text-anchor="middle">pdf</text>

  <path class="f" d="M164,67  C210,67  200,150 246,158"/>
  <path class="f" d="M164,107 C210,107 200,158 246,164"/>
  <path class="f" d="M164,147 C210,147 210,166 246,170"/>
  <path class="f" d="M164,187 C210,187 210,180 246,178"/>
  <path class="f" d="M164,227 C210,227 200,190 246,184"/>
  <path class="f" d="M164,267 C210,267 200,198 246,190"/>

  <rect class="s" x="250" y="146" width="150" height="56"/>
  <text class="l" x="325" y="168" text-anchor="middle">w.Add(resp)</text>
  <text class="i" x="325" y="186" text-anchor="middle">any format, any order</text>

  <path class="f" d="M400,174 C446,174 460,74 508,74"/>

  <rect class="b" x="512" y="56" width="190" height="34"/>
  <text class="m" x="530" y="78">root</text>
  <rect class="b" x="537" y="104" width="190" height="34"/>
  <text class="m" x="555" y="126">domain</text>
  <rect class="b" x="562" y="152" width="190" height="34"/>
  <text class="m" x="580" y="174">uri</text>
  <rect class="b" x="587" y="200" width="190" height="34"/>
  <text class="m" x="605" y="222">document</text>
  <rect class="s" x="612" y="248" width="190" height="34"/>
  <text class="m" x="630" y="270">content</text>

  <path class="t" d="M524,90 V121 H533"/>
  <path class="t" d="M549,138 V169 H558"/>
  <path class="t" d="M574,186 V217 H583"/>
  <path class="t" d="M599,234 V265 H608"/>

  <text class="n" x="812" y="78" text-anchor="end">one crawl</text>
  <text class="n" x="812" y="126" text-anchor="end">one site</text>
  <text class="n" x="812" y="174" text-anchor="end">one page</text>
  <text class="n" x="812" y="222" text-anchor="end">one body</text>
  <text class="n" x="812" y="270" text-anchor="end">the elements</text>

  <text class="n" x="440" y="322" text-anchor="middle">Every node can report its own address: an XPath, a CSS selector and a native path. That is what makes a located</text>
  <text class="n" x="440" y="340" text-anchor="middle">field expressible as a rule that runs against pages it was never induced from.</text>
  <text class="n" x="440" y="372" text-anchor="middle">The graph is built from the cache rather than the network, so training and re-extraction never crawl again.</text>
</svg>
