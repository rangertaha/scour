<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img"
     aria-label="Plugin names from the job document are resolved against a registry of what this node has compiled in. Names that resolve become ordered links wrapping the core; a name nothing implements refuses the whole chain.">
  <style>
    .b{fill:#f6f8fa;stroke:#57606a;stroke-width:1.5;rx:6}
    .s{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5;rx:6}
    .g{fill:none;stroke:#d0d7de;stroke-width:1.5;stroke-dasharray:4 3;rx:8}
    .l{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1f2328}
    .i{font:10.5px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#57606a}
    .n{font:11px -apple-system,system-ui,sans-serif;fill:#57606a}
    .k{font:11px -apple-system,system-ui,sans-serif;fill:#0969da}
    .f{stroke:#57606a;stroke-width:1.5;fill:none;marker-end:url(#a)}
    .fk{stroke:#0969da;stroke-width:1.5;fill:none;marker-end:url(#ak)}
    .fd{stroke:#57606a;stroke-width:1.5;fill:none;stroke-dasharray:4 3}
    .ah{fill:#57606a}
    .ak{fill:#0969da}
    @media (prefers-color-scheme:dark){
      .b{fill:#21262d;stroke:#8b949e} .s{fill:#0d2d4d;stroke:#58a6ff}
      .g{stroke:#30363d}
      .l{fill:#e6edf3} .i,.n{fill:#8b949e} .k{fill:#58a6ff}
      .f{stroke:#8b949e} .fd{stroke:#8b949e} .ah{fill:#8b949e}
      .fk{stroke:#58a6ff} .ak{fill:#58a6ff}}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="ak" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <text class="n" x="450" y="18" text-anchor="middle">a list of names becomes a chain that runs, or the whole chain is refused</text>
  <rect class="b" x="40" y="40" width="300" height="76"/>
  <text class="l" x="190" y="83" text-anchor="middle">the job document</text>
  <text class="i" x="190" y="82" text-anchor="middle">cache at 900, retry at 550, gadget</text>
  <text class="n" x="190" y="104" text-anchor="middle">what a job asked for</text>
  <rect class="s" x="560" y="40" width="300" height="76"/>
  <text class="l" x="710" y="83" text-anchor="middle">this node's registry</text>
  <text class="i" x="710" y="82" text-anchor="middle">cache, retry, offsite, depth, topic</text>
  <text class="n" x="710" y="104" text-anchor="middle">what this build compiled in</text>
  <path class="f" d="M190,116 V150 H430 V172"/>
  <path class="f" d="M710,116 V150 H470 V172"/>
  <rect class="s" x="370" y="172" width="160" height="48"/>
  <text class="l" x="450" y="194" text-anchor="middle">internal/plugin</text>
  <text class="i" x="450" y="210" text-anchor="middle">the seam</text>
  <path class="f" d="M420,220 V254 H250"/>
  <rect class="b" x="80" y="254" width="340" height="62"/>
  <text class="l" x="250" y="290" text-anchor="middle">an ordered chain</text>
  <text class="i" x="250" y="296" text-anchor="middle">which owns whatever its plugins opened</text>
  <text class="k" x="250" y="332" text-anchor="middle">every name resolved</text>
  <path class="f" d="M480,220 V254 H650"/>
  <rect class="b" x="480" y="254" width="380" height="62"/>
  <text class="l" x="670" y="290" text-anchor="middle">the whole chain is refused</text>
  <text class="i" x="670" y="296" text-anchor="middle">naming every missing name, and what this node has</text>
  <text class="k" x="670" y="332" text-anchor="middle">gadget is not implemented here</text>

</svg>
