<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 338" role="img"
     aria-label="Two tables. The urls table is per job and holds waiting URLs with a score, a depth and the time each becomes ready again. The hosts table is shared across jobs and holds, per host, the earliest time it may next be touched and the delay it asked for. A lease joins them, taking the highest-scoring ready URL whose host is not cooling.">
  <style>
    .b{fill:#f6f8fa;stroke:#57606a;stroke-width:1.5;rx:6}
    .s{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5;rx:6}
    .g{fill:none;stroke:#d0d7de;stroke-width:1.5;stroke-dasharray:4 3;rx:8}
    .l{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1f2328}
    .i{font:10.5px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#57606a}
    .n{font:11px -apple-system,system-ui,sans-serif;fill:#57606a}
    .k{font:11px -apple-system,system-ui,sans-serif;fill:#0969da}
    .f{stroke:#57606a;stroke-width:1.5;fill:none;marker-end:url(#a)}
    .fk{stroke:#0969da;stroke-width:1.5;fill:none;marker-end:url(#ak)}
    .fd{stroke:#57606a;stroke-width:1.5;fill:none;stroke-dasharray:4 3}
    .ah{fill:#57606a}
    .ak{fill:#0969da}
    @media (prefers-color-scheme:dark){
      .b{fill:#21262d;stroke:#8b949e} .s{fill:#0d2d4d;stroke:#58a6ff}
      .g{stroke:#30363d}
      .l{fill:#e6edf3} .i,.n{fill:#8b949e} .k{fill:#58a6ff}
      .f{stroke:#8b949e} .fd{stroke:#8b949e} .ah{fill:#8b949e}
      .fk{stroke:#58a6ff} .ak{fill:#58a6ff}}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="ak" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <text class="n" x="450" y="18" text-anchor="middle">two tables in one SQLite database</text>
  <rect class="b" x="24" y="34" width="404" height="176"/>
  <text class="l" x="44" y="56" text-anchor="start">urls</text>
  <text class="i" x="96" y="56" text-anchor="start">one row per URL, per job</text>
  <path class="fd" d="M44,66 H408"/>
  <text class="i" x="48" y="86" text-anchor="start">hash</text>
  <text class="i" x="112" y="86" text-anchor="start">host</text>
  <text class="i" x="176" y="86" text-anchor="start">score</text>
  <text class="i" x="240" y="86" text-anchor="start">depth</text>
  <text class="i" x="304" y="86" text-anchor="start">status</text>
  <text class="i" x="368" y="86" text-anchor="start">ready_at</text>
  <text class="i" x="48" y="106" text-anchor="start">a1f3</text>
  <text class="i" x="112" y="106" text-anchor="start">a.com</text>
  <text class="i" x="176" y="106" text-anchor="start">0.91</text>
  <text class="i" x="240" y="106" text-anchor="start">1</text>
  <text class="i" x="304" y="106" text-anchor="start">waiting</text>
  <text class="i" x="368" y="106" text-anchor="start">0</text>
  <text class="i" x="48" y="126" text-anchor="start">b7c2</text>
  <text class="i" x="112" y="126" text-anchor="start">a.com</text>
  <text class="i" x="176" y="126" text-anchor="start">0.44</text>
  <text class="i" x="240" y="126" text-anchor="start">2</text>
  <text class="i" x="304" y="126" text-anchor="start">waiting</text>
  <text class="i" x="368" y="126" text-anchor="start">0</text>
  <text class="i" x="48" y="146" text-anchor="start">c091</text>
  <text class="i" x="112" y="146" text-anchor="start">b.com</text>
  <text class="i" x="176" y="146" text-anchor="start">0.88</text>
  <text class="i" x="240" y="146" text-anchor="start">1</text>
  <text class="i" x="304" y="146" text-anchor="start">waiting</text>
  <text class="i" x="368" y="146" text-anchor="start">12:05:12</text>
  <text class="n" x="226" y="194" text-anchor="middle">a lease is a waiting row that is not ready yet</text>
  <rect class="s" x="472" y="34" width="404" height="176"/>
  <text class="l" x="492" y="56" text-anchor="start">hosts</text>
  <text class="i" x="556" y="56" text-anchor="start">one row per host, shared by every job</text>
  <path class="fd" d="M492,66 H856"/>
  <text class="i" x="496" y="86" text-anchor="start">host</text>
  <text class="i" x="624" y="86" text-anchor="start">next_at</text>
  <text class="i" x="752" y="86" text-anchor="start">delay</text>
  <text class="i" x="496" y="106" text-anchor="start">a.com</text>
  <text class="i" x="624" y="106" text-anchor="start">12:04:31.220</text>
  <text class="i" x="752" y="106" text-anchor="start">2s</text>
  <text class="i" x="496" y="126" text-anchor="start">b.com</text>
  <text class="i" x="624" y="126" text-anchor="start">12:04:29.870</text>
  <text class="i" x="752" y="126" text-anchor="start">10s</text>
  <text class="n" x="674" y="170" text-anchor="middle">delay is what the site asked for;</text>
  <text class="n" x="674" y="186" text-anchor="middle">next_at is when it may be touched again</text>
  <path class="fk" d="M428,122 H466"/>
  <text class="k" x="447" y="112" text-anchor="middle">join</text>
  <path class="f" d="M226,210 V244"/>
  <path class="f" d="M674,210 V228 H560 V244"/>
  <rect class="s" x="160" y="244" width="580" height="52"/>
  <text class="l" x="450" y="275" text-anchor="middle">the lease</text>
  <text class="i" x="450" y="282" text-anchor="middle">best score whose host is not cooling, held with a timeout</text>
  <text class="n" x="450" y="322" text-anchor="middle">guarded by one seek: is any host free at all? If none is, nothing can be leased</text>

</svg>
