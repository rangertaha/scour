<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" role="img"
     aria-label="A URL is taken from the frontier, fetched through a transport, and cached. Training parses the cache into one graph and induces locators. Scoring feeds the frontier.">
  <style>
    .box   { fill: #f6f8fa; stroke: #57606a; stroke-width: 1.5; rx: 6; }
    .store { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.5; }
    .label { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1f2328; }
    .note  { font: 11px -apple-system, system-ui, sans-serif; fill: #57606a; }
    .flow  { stroke: #57606a; stroke-width: 1.5; fill: none; marker-end: url(#a); }
    .learn { stroke: #0969da; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; marker-end: url(#b); }
    @media (prefers-color-scheme: dark) {
      .box   { fill: #21262d; stroke: #8b949e; }
      .store { fill: #0d2d4d; stroke: #58a6ff; }
      .label { fill: #e6edf3; }
      .note  { fill: #8b949e; }
      .flow  { stroke: #8b949e; }
      .learn { stroke: #58a6ff; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0969da"/>
    </marker>
  </defs>

  <rect class="box store" x="20"  y="40" width="120" height="46"/>
  <text class="label" x="80"  y="60" text-anchor="middle">frontier</text>
  <text class="note"  x="80"  y="76" text-anchor="middle">ranked URLs</text>

  <rect class="box" x="190" y="40" width="120" height="46"/>
  <text class="label" x="250" y="68" text-anchor="middle">transport</text>

  <rect class="box store" x="360" y="40" width="120" height="46"/>
  <text class="label" x="420" y="60" text-anchor="middle">cache</text>
  <text class="note"  x="420" y="76" text-anchor="middle">page bodies</text>

  <rect class="box" x="530" y="40" width="120" height="46"/>
  <text class="label" x="590" y="68" text-anchor="middle">parse</text>

  <rect class="box" x="700" y="40" width="140" height="46"/>
  <text class="label" x="770" y="60" text-anchor="middle">wom</text>
  <text class="note"  x="770" y="76" text-anchor="middle">one graph</text>

  <path class="flow" d="M140,63 H186"/>
  <path class="flow" d="M310,63 H356"/>
  <path class="flow" d="M480,63 H526"/>
  <path class="flow" d="M650,63 H696"/>

  <text class="note" x="163" y="56" text-anchor="middle">url</text>
  <text class="note" x="333" y="56" text-anchor="middle">body</text>

  <rect class="box" x="700" y="150" width="140" height="46"/>
  <text class="label" x="770" y="178" text-anchor="middle">matcher</text>

  <rect class="box" x="530" y="150" width="120" height="46"/>
  <text class="label" x="590" y="170" text-anchor="middle">induce</text>
  <text class="note"  x="590" y="186" text-anchor="middle">locators</text>

  <rect class="box store" x="360" y="150" width="120" height="46"/>
  <text class="label" x="420" y="170" text-anchor="middle">records</text>
  <text class="note"  x="420" y="186" text-anchor="middle">+ rules</text>

  <path class="flow" d="M770,86 V146"/>
  <path class="flow" d="M696,173 H654"/>
  <path class="flow" d="M526,173 H484"/>

  <rect class="box" x="190" y="150" width="120" height="46"/>
  <text class="label" x="250" y="178" text-anchor="middle">score</text>

  <rect class="box" x="20" y="150" width="120" height="46"/>
  <text class="label" x="80" y="170" text-anchor="middle">nodeclass</text>
  <text class="note" x="80" y="186" text-anchor="middle">what a URL is</text>

  <path class="learn" d="M356,173 H314"/>
  <path class="learn" d="M186,173 H144"/>
  <path class="learn" d="M80,150 V90"/>

  <text class="note" x="250" y="230" text-anchor="middle">the dashed path is what learns from the last run</text>
  <text class="note" x="420" y="266" text-anchor="middle">blue boxes are durable: the frontier, the page cache, the records</text>
</svg>
