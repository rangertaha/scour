<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 274" role="img"
     aria-label="Five pipeline steps arranged by dependency, in four waves. Clean runs first; validate and dedupe both require clean and run at the same time, which is the widest wave; rank requires both of them; a python step requires rank.">
  <style>
    .b{fill:#f6f8fa;stroke:#57606a;stroke-width:1.5;rx:6}
    .s{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5;rx:6}
    .g{fill:none;stroke:#d0d7de;stroke-width:1.5;stroke-dasharray:4 3;rx:8}
    .l{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1f2328}
    .i{font:10.5px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#57606a}
    .n{font:11px -apple-system,system-ui,sans-serif;fill:#57606a}
    .k{font:11px -apple-system,system-ui,sans-serif;fill:#0969da}
    .f{stroke:#57606a;stroke-width:1.5;fill:none;marker-end:url(#a)}
    .fk{stroke:#0969da;stroke-width:1.5;fill:none;marker-end:url(#ak)}
    .fd{stroke:#57606a;stroke-width:1.5;fill:none;stroke-dasharray:4 3}
    .ah{fill:#57606a}
    .ak{fill:#0969da}
    @media (prefers-color-scheme:dark){
      .b{fill:#21262d;stroke:#8b949e} .s{fill:#0d2d4d;stroke:#58a6ff}
      .g{stroke:#30363d}
      .l{fill:#e6edf3} .i,.n{fill:#8b949e} .k{fill:#58a6ff}
      .f{stroke:#8b949e} .fd{stroke:#8b949e} .ah{fill:#8b949e}
      .fk{stroke:#58a6ff} .ak{fill:#58a6ff}}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="ak" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <text class="n" x="450" y="18" text-anchor="middle">the waves are computed, not written</text>
  <text class="n" x="120" y="46" text-anchor="middle">wave 1</text>
  <text class="n" x="360" y="46" text-anchor="middle">wave 2, two at once</text>
  <text class="n" x="580" y="46" text-anchor="middle">wave 3</text>
  <text class="n" x="780" y="46" text-anchor="middle">wave 4</text>
  <rect class="g" x="40" y="56" width="160" height="150"/>
  <rect class="g" x="250" y="56" width="200" height="150"/>
  <rect class="g" x="500" y="56" width="160" height="150"/>
  <rect class="g" x="700" y="56" width="160" height="150"/>
  <rect class="s" x="60" y="108" width="120" height="46"/>
  <text class="l" x="120" y="129" text-anchor="middle">clean</text>
  <text class="i" x="120" y="145" text-anchor="middle">article</text>
  <rect class="b" x="270" y="74" width="160" height="46"/>
  <text class="l" x="350" y="95" text-anchor="middle">validate</text>
  <text class="i" x="350" y="111" text-anchor="middle">article</text>
  <rect class="b" x="270" y="142" width="160" height="46"/>
  <text class="l" x="350" y="163" text-anchor="middle">dedupe</text>
  <text class="i" x="350" y="179" text-anchor="middle">article</text>
  <rect class="b" x="520" y="108" width="120" height="46"/>
  <text class="l" x="580" y="129" text-anchor="middle">rank</text>
  <text class="i" x="580" y="145" text-anchor="middle">article</text>
  <rect class="b" x="720" y="108" width="120" height="46"/>
  <text class="l" x="780" y="129" text-anchor="middle">python</text>
  <text class="i" x="780" y="145" text-anchor="middle">enrich</text>
  <path class="f" d="M180,124 V97 H266"/>
  <path class="f" d="M180,138 V165 H266"/>
  <path class="f" d="M430,97 V124 H516"/>
  <path class="f" d="M430,165 V138 H516"/>
  <path class="f" d="M640,131 H716"/>
  <text class="n" x="450" y="238" text-anchor="middle">a step is a node in a graph, ordered by what it requires</text>
  <text class="i" x="450" y="258" text-anchor="middle">the width of a wave is what a run can actually do at the same time</text>

</svg>
