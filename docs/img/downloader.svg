<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 372" role="img"
     aria-label="A request passes through the redirect follower, then the robots check, then the plugin chain, then the fetch. A disallowed URL is dropped at the robots check before the chain is entered. A redirect sends the next hop back to the outside, so it passes through the robots check for its own host and is checked against the job's scope.">
  <style>
    .b{fill:#f6f8fa;stroke:#57606a;stroke-width:1.5;rx:6}
    .s{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5;rx:6}
    .g{fill:none;stroke:#d0d7de;stroke-width:1.5;stroke-dasharray:4 3;rx:8}
    .l{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1f2328}
    .i{font:10.5px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#57606a}
    .n{font:11px -apple-system,system-ui,sans-serif;fill:#57606a}
    .k{font:11px -apple-system,system-ui,sans-serif;fill:#0969da}
    .f{stroke:#57606a;stroke-width:1.5;fill:none;marker-end:url(#a)}
    .fk{stroke:#0969da;stroke-width:1.5;fill:none;marker-end:url(#ak)}
    .fd{stroke:#57606a;stroke-width:1.5;fill:none;stroke-dasharray:4 3}
    .ah{fill:#57606a}
    .ak{fill:#0969da}
    @media (prefers-color-scheme:dark){
      .b{fill:#21262d;stroke:#8b949e} .s{fill:#0d2d4d;stroke:#58a6ff}
      .g{stroke:#30363d}
      .l{fill:#e6edf3} .i,.n{fill:#8b949e} .k{fill:#58a6ff}
      .f{stroke:#8b949e} .fd{stroke:#8b949e} .ah{fill:#8b949e}
      .fk{stroke:#58a6ff} .ak{fill:#58a6ff}}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="ak" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <text class="n" x="450" y="18" text-anchor="middle">the chain is a job's business; the two things outside it are not</text>
  <rect class="g" x="30" y="34" width="840" height="210"/>
  <text class="n" x="50" y="54" text-anchor="start">max_redirects: an attribute, and it wraps everything</text>
  <rect class="g" x="60" y="66" width="780" height="164"/>
  <text class="n" x="80" y="86" text-anchor="start">robots: an attribute, outside the chain</text>
  <rect class="g" x="90" y="98" width="720" height="118"/>
  <text class="n" x="110" y="118" text-anchor="start">the chain: offsite 500, retry 550, cache 900</text>
  <rect class="s" x="300" y="132" width="300" height="62"/>
  <text class="l" x="450" y="168" text-anchor="middle">one request, one response</text>
  <text class="i" x="450" y="208" text-anchor="middle">a job's own plugins, in order</text>
  <path class="f" d="M600,163 H840 V280 H700"/>
  <rect class="b" x="700" y="258" width="140" height="44"/>
  <text class="l" x="770" y="285" text-anchor="middle">the network</text>
  <path class="fd" d="M90,146 H40 V300 H150"/>
  <text class="i" x="95" y="292" text-anchor="start">disallowed: dropped before the chain is entered</text>
  <text class="n" x="450" y="340" text-anchor="middle">a 3xx is a new URL: the next hop starts again from the outside, against its own</text>
  <text class="n" x="450" y="356" text-anchor="middle">host's robots.txt, checked against the job's scope, and cached under its own key</text>

</svg>
