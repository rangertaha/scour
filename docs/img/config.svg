<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" role="img"
     aria-label="Settings resolve in four steps: command line flags, then environment variables, then a config file, then built-in defaults. Paths differ between a per-user install and a packaged one.">
  <style>
    .b{fill:#f6f8fa;stroke:#57606a;stroke-width:1.5;rx:6}
    .s{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5;rx:6}
    .l{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1f2328}
    .m{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1f2328}
    .i{font:10.5px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#57606a}
    .n{font:11px -apple-system,system-ui,sans-serif;fill:#57606a}
    .h{font:600 12px -apple-system,system-ui,sans-serif;fill:#1f2328}
    .num{font:600 12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#57606a}
    .f{stroke:#57606a;stroke-width:1.5;fill:none;marker-end:url(#a)}
    .ah{fill:#57606a}
    .sep{stroke:#d0d7de;stroke-width:1}
    @media (prefers-color-scheme:dark){
      .b{fill:#21262d;stroke:#8b949e} .s{fill:#0d2d4d;stroke:#58a6ff}
      .l,.m,.h{fill:#e6edf3} .i,.n,.num{fill:#8b949e} .f{stroke:#8b949e} .ah{fill:#8b949e}
      .sep{stroke:#30363d}}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <text class="h" x="44" y="34">what wins</text>
  <text class="n" x="404" y="34" text-anchor="end">a flag always wins, a packaged default never overwrites a local one</text>

  <path class="f" d="M24,58 V300"/>

  <text class="num" x="40" y="92">1</text>
  <rect class="s" x="52" y="62" width="352" height="54"/>
  <text class="l" x="68" y="84">command line flags</text>
  <text class="i" x="68" y="102">what you typed, this once</text>

  <text class="num" x="40" y="154">2</text>
  <rect class="b" x="52" y="124" width="352" height="54"/>
  <text class="l" x="68" y="146">environment</text>
  <text class="i" x="68" y="164">SCOUR_CONFIG · SCOUR_LISTEN · SCOUR_DATA_DIR · SCOUR_CACHE_DIR</text>

  <text class="num" x="40" y="216">3</text>
  <rect class="b" x="52" y="186" width="352" height="54"/>
  <text class="l" x="68" y="208">a config file</text>
  <text class="i" x="68" y="226">/etc/scour/config.toml if it exists, else the user's own</text>

  <text class="num" x="40" y="278">4</text>
  <rect class="b" x="52" y="248" width="352" height="54"/>
  <text class="l" x="68" y="270">built-in defaults</text>
  <text class="i" x="68" y="288">a complete configuration on its own, so an empty file is valid</text>

  <line class="sep" x1="440" y1="20" x2="440" y2="320"/>

  <text class="h" x="470" y="34">where things live</text>

  <rect class="b" x="470" y="62" width="386" height="112"/>
  <text class="l" x="486" y="84">per user</text>
  <text class="m" x="486" y="106">~/.config/scour/config.toml · scour.db · models/</text>
  <text class="m" x="486" y="128">~/.cache/scour/pages/</text>
  <text class="m" x="486" y="150">~/.local/share/scour/exports/</text>
  <text class="i" x="486" y="167">working data outside the config directory, so it can be cleared</text>

  <rect class="b" x="470" y="186" width="386" height="116"/>
  <text class="l" x="486" y="208">packaged</text>
  <text class="m" x="486" y="230">/etc/scour/config.toml</text>
  <text class="m" x="486" y="252">/var/lib/scour/  scour.db · models/ · exports/</text>
  <text class="m" x="486" y="274">/var/cache/scour/pages/</text>
  <text class="i" x="486" y="291">chosen by /etc/scour/config.toml existing, not by a flag</text>

  <text class="n" x="440" y="348" text-anchor="middle">Only the cache is safe to delete. Everything under the data directory is state you would have to re-crawl to rebuild,</text>
  <text class="n" x="440" y="366" text-anchor="middle">and the marks on records could not be rebuilt at all.</text>
  <text class="n" x="440" y="390" text-anchor="middle">The two files are the same format. Only their paths and the defaults for the directory settings differ.</text>
</svg>
