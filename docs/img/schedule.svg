<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" role="img"
     aria-label="Two separate decisions over one frontier. A policy orders what is already waiting and hands out a lease. A refresh policy decides which fetched URLs are due again and returns them to the frontier. Politeness is neither of them.">
  <style>
    .b{fill:#f6f8fa;stroke:#57606a;stroke-width:1.5;rx:6}
    .s{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5;rx:6}
    .d{fill:#f6f8fa;stroke:#57606a;stroke-width:1.5;stroke-dasharray:4 3;rx:6}
    .l{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1f2328}
    .i{font:10.5px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#57606a}
    .n{font:11px -apple-system,system-ui,sans-serif;fill:#57606a}
    .f{stroke:#57606a;stroke-width:1.5;fill:none;marker-end:url(#a)}
    .k{stroke:#0969da;stroke-width:1.5;fill:none;stroke-dasharray:4 3;marker-end:url(#b)}
    .ah{fill:#57606a} .bh{fill:#0969da}
    @media (prefers-color-scheme:dark){
      .b,.d{fill:#21262d;stroke:#8b949e} .s{fill:#0d2d4d;stroke:#58a6ff}
      .l{fill:#e6edf3} .i,.n{fill:#8b949e} .f{stroke:#8b949e} .k{stroke:#58a6ff}
      .ah{fill:#8b949e} .bh{fill:#58a6ff}}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="bh" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <text class="n" x="440" y="24" text-anchor="middle">a crawl has more URLs waiting than it will ever fetch, so the order they come out in is most of what a crawl is</text>

  <rect class="s" x="40" y="88" width="200" height="112"/>
  <text class="l" x="140" y="112" text-anchor="middle">frontier</text>
  <text class="i" x="140" y="132" text-anchor="middle">150,000 rows</text>
  <text class="i" x="140" y="150" text-anchor="middle">score · depth · host</text>
  <text class="i" x="140" y="168" text-anchor="middle">last fetched · attempts</text>
  <text class="i" x="140" y="188" text-anchor="middle">one table, two readers</text>

  <rect class="b" x="320" y="64" width="240" height="72"/>
  <text class="l" x="440" y="86" text-anchor="middle">Policy</text>
  <text class="i" x="440" y="103" text-anchor="middle">orders what is waiting</text>
  <text class="i" x="440" y="122" text-anchor="middle">best · breadth · depth · random · warmup</text>

  <rect class="d" x="320" y="168" width="240" height="72"/>
  <text class="l" x="440" y="190" text-anchor="middle">Refresh</text>
  <text class="i" x="440" y="207" text-anchor="middle">decides what is due again</text>
  <text class="i" x="440" y="226" text-anchor="middle">cron, registered and not written yet</text>

  <rect class="b" x="640" y="110" width="200" height="56"/>
  <text class="l" x="740" y="132" text-anchor="middle">lease</text>
  <text class="i" x="740" y="149" text-anchor="middle">one URL, one crawler</text>

  <path class="f" d="M240,120 H316"/>
  <path class="f" d="M240,176 C280,176 286,202 316,202"/>
  <path class="f" d="M560,100 C600,100 606,132 636,132"/>
  <path class="k" d="M440,240 V292 H140 V204"/>

  <text class="n" x="290" y="312" text-anchor="middle">a front page changes hourly, an archived article never again</text>

  <text class="n" x="440" y="350" text-anchor="middle">A policy returns an order from a closed set, never a SQL fragment: the choice has to be made by the database,</text>
  <text class="n" x="440" y="368" text-anchor="middle">and taking SQL from a policy would take an injection point and a dependency on the schema at once.</text>
  <text class="n" x="440" y="390" text-anchor="middle">Neither decides politeness. Which hosts are cooling is worked out from when each was last fetched.</text>
</svg>
