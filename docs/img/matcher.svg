<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" role="img"
     aria-label="A property and a candidate node go into the matcher, which answers how strongly that node is that field. Two implementations are registered: a heuristic one needing no network, and one that asks a language model.">
  <style>
    .b{fill:#f6f8fa;stroke:#57606a;stroke-width:1.5;rx:6}
    .s{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5;rx:6}
    .l{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1f2328}
    .m{font:11.5px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1f2328}
    .i{font:10.5px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#57606a}
    .n{font:11px -apple-system,system-ui,sans-serif;fill:#57606a}
    .big{font:600 22px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#0969da}
    .f{stroke:#57606a;stroke-width:1.5;fill:none;marker-end:url(#a)}
    .t{stroke:#0969da;stroke-width:1.2;fill:none;opacity:.6}
    .ah{fill:#57606a}
    @media (prefers-color-scheme:dark){
      .b{fill:#21262d;stroke:#8b949e} .s{fill:#0d2d4d;stroke:#58a6ff}
      .l,.m{fill:#e6edf3} .i,.n{fill:#8b949e} .f{stroke:#8b949e} .t{stroke:#58a6ff}
      .ah{fill:#8b949e} .big{fill:#58a6ff}}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <text class="n" x="440" y="22" text-anchor="middle">the seam where scour's intelligence is chosen</text>

  <rect class="b" x="24" y="52" width="230" height="92"/>
  <text class="l" x="40" y="74">Prop</text>
  <text class="m" x="40" y="96">name    price</text>
  <text class="m" x="40" y="114">aliases asking price</text>
  <text class="m" x="40" y="132">example $42,000</text>

  <rect class="b" x="24" y="176" width="230" height="92"/>
  <text class="l" x="40" y="198">Node</text>
  <text class="m" x="40" y="220">&lt;dd class="price"&gt;</text>
  <text class="m" x="40" y="238">  $41,995</text>
  <text class="m" x="40" y="256">&lt;/dd&gt;</text>

  <path class="f" d="M254,98  C296,98  292,146 320,152"/>
  <path class="f" d="M254,222 C296,222 292,178 320,172"/>

  <rect class="s" x="324" y="128" width="212" height="68"/>
  <text class="l" x="430" y="152" text-anchor="middle">Matcher</text>
  <text class="i" x="430" y="172" text-anchor="middle">Score(ctx, Prop, *Node)</text>
  <text class="i" x="430" y="188" text-anchor="middle">float64</text>

  <path class="f" d="M536,162 H600"/>

  <rect class="b" x="604" y="128" width="250" height="68"/>
  <text class="big" x="729" y="162" text-anchor="middle">0.91</text>
  <text class="i" x="729" y="184" text-anchor="middle">is this node that field?</text>

  <path class="t" d="M380,196 V232"/>
  <path class="t" d="M480,196 V232"/>

  <rect class="b" x="310" y="236" width="140" height="46"/>
  <text class="l" x="380" y="257" text-anchor="middle">heuristic</text>
  <text class="i" x="380" y="273" text-anchor="middle">no key, no network</text>

  <rect class="b" x="470" y="236" width="140" height="46"/>
  <text class="l" x="540" y="257" text-anchor="middle">llm</text>
  <text class="i" x="540" y="273" text-anchor="middle">cached judgements</text>

  <text class="n" x="440" y="316" text-anchor="middle">Swapping the implementation swaps what the engine understands, without touching graph construction,</text>
  <text class="n" x="440" y="334" text-anchor="middle">locator synthesis, or a line of crawl code. Everything richer is measured against the heuristic.</text>
  <text class="n" x="440" y="366" text-anchor="middle">This ranks nodes of a parsed page. Ranking URLs of the crawl graph is a different registry, and lives in score.</text>
</svg>
