<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" role="img"
     aria-label="Cached pages become one graph. Induction chooses the record container first and only then fixes the fields inside it, producing rules. Extraction applies those rules per page to make records, and the marks a person puts on records feed the next induction.">
  <style>
    .b{fill:#f6f8fa;stroke:#57606a;stroke-width:1.5;rx:6}
    .s{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5;rx:6}
    .in{fill:#f6f8fa;stroke:#57606a;stroke-width:1.5;rx:4}
    .l{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1f2328}
    .m{font:11.5px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1f2328}
    .i{font:10.5px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#57606a}
    .n{font:11px -apple-system,system-ui,sans-serif;fill:#57606a}
    .f{stroke:#57606a;stroke-width:1.5;fill:none;marker-end:url(#a)}
    .k{stroke:#0969da;stroke-width:1.5;fill:none;stroke-dasharray:4 3;marker-end:url(#b)}
    .ah{fill:#57606a} .bh{fill:#0969da}
    @media (prefers-color-scheme:dark){
      .b,.in{fill:#21262d;stroke:#8b949e} .s{fill:#0d2d4d;stroke:#58a6ff}
      .l,.m{fill:#e6edf3} .i,.n{fill:#8b949e} .f{stroke:#8b949e} .k{stroke:#58a6ff}
      .ah{fill:#8b949e} .bh{fill:#58a6ff}}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="bh" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <text class="n" x="440" y="22" text-anchor="middle">induction is expensive and happens once; extraction is cheap and happens per page</text>

  <rect class="s" x="24" y="80" width="150" height="52"/>
  <text class="l" x="99" y="101" text-anchor="middle">pages</text>
  <text class="i" x="99" y="118" text-anchor="middle">from the cache</text>

  <rect class="b" x="214" y="80" width="150" height="52"/>
  <text class="l" x="289" y="101" text-anchor="middle">wom graph</text>
  <text class="i" x="289" y="118" text-anchor="middle">all of them at once</text>

  <rect class="b" x="404" y="62" width="230" height="88"/>
  <text class="l" x="519" y="82" text-anchor="middle">induce</text>
  <rect class="in" x="418" y="92" width="202" height="24"/>
  <text class="m" x="428" y="109">1. where a record lives</text>
  <rect class="in" x="418" y="120" width="202" height="24"/>
  <text class="m" x="428" y="137">2. the fields inside it</text>

  <rect class="s" x="674" y="80" width="170" height="52"/>
  <text class="l" x="759" y="101" text-anchor="middle">rules</text>
  <text class="i" x="759" y="118" text-anchor="middle">xpath · css · regex</text>

  <path class="f" d="M174,106 H210"/>
  <path class="f" d="M364,106 H400"/>
  <path class="f" d="M634,106 H670"/>

  <path class="f" d="M759,132 V262 H368"/>
  <text class="n" x="600" y="254" text-anchor="middle">applied to every cached page</text>

  <rect class="b" x="214" y="236" width="150" height="52"/>
  <text class="l" x="289" y="257" text-anchor="middle">extract</text>
  <text class="i" x="289" y="274" text-anchor="middle">per page</text>

  <rect class="s" x="404" y="236" width="150" height="52"/>
  <text class="l" x="479" y="257" text-anchor="middle">records</text>
  <text class="i" x="479" y="274" text-anchor="middle">one row each</text>

  <rect class="b" x="594" y="236" width="150" height="52"/>
  <text class="l" x="669" y="257" text-anchor="middle">marks</text>
  <text class="i" x="669" y="274" text-anchor="middle">valid · invalid</text>

  <path class="f" d="M364,262 H400"/>
  <path class="f" d="M554,262 H590"/>

  <path class="k" d="M744,262 H800 V196 H519 V154"/>

  <text class="n" x="440" y="326" text-anchor="middle">The order in step one and two is the whole of it, and it was got wrong once: choosing where a field lives before</text>
  <text class="n" x="440" y="344" text-anchor="middle">knowing where the record lives let a feed's logo beat the article, and forty five articles became one.</text>
  <text class="n" x="440" y="376" text-anchor="middle">A record marked wrong is held out of the next run, so both the scorer and the rules stop making that mistake.</text>
</svg>
