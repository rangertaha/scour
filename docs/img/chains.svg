<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img"
     aria-label="The same three links, twice. On the way out a request passes offsite at 500, retry at 550 and cache at 900, in that order, and reaches the network. On the way back the response passes the same three in reverse. A cache hit returns from 900 without the network being reached, so the links outside it still see a response and the ones inside it never ran. A drop at offsite ends the request there.">
  <style>
    .b{fill:#f6f8fa;stroke:#57606a;stroke-width:1.5;rx:6}
    .s{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5;rx:6}
    .g{fill:none;stroke:#d0d7de;stroke-width:1.5;stroke-dasharray:4 3;rx:8}
    .l{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1f2328}
    .i{font:10.5px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#57606a}
    .n{font:11px -apple-system,system-ui,sans-serif;fill:#57606a}
    .k{font:11px -apple-system,system-ui,sans-serif;fill:#0969da}
    .f{stroke:#57606a;stroke-width:1.5;fill:none;marker-end:url(#a)}
    .fk{stroke:#0969da;stroke-width:1.5;fill:none;marker-end:url(#ak)}
    .fd{stroke:#57606a;stroke-width:1.5;fill:none;stroke-dasharray:4 3}
    .ah{fill:#57606a}
    .ak{fill:#0969da}
    @media (prefers-color-scheme:dark){
      .b{fill:#21262d;stroke:#8b949e} .s{fill:#0d2d4d;stroke:#58a6ff}
      .g{stroke:#30363d}
      .l{fill:#e6edf3} .i,.n{fill:#8b949e} .k{fill:#58a6ff}
      .f{stroke:#8b949e} .fd{stroke:#8b949e} .ah{fill:#8b949e}
      .fk{stroke:#58a6ff} .ak{fill:#58a6ff}}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="ak" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <text class="n" x="450" y="18" text-anchor="middle">the same three links, seen twice</text>
  <text class="n" x="60" y="46" text-anchor="start">on the way out</text>
  <text class="i" x="60" y="60" text-anchor="start">low order first</text>
  <rect class="b" x="190" y="34" width="150" height="44"/>
  <text class="l" x="265" y="54" text-anchor="middle">offsite</text>
  <text class="i" x="265" y="70" text-anchor="middle">500</text>
  <rect class="b" x="370" y="34" width="150" height="44"/>
  <text class="l" x="445" y="54" text-anchor="middle">retry</text>
  <text class="i" x="445" y="70" text-anchor="middle">550</text>
  <rect class="s" x="550" y="34" width="150" height="44"/>
  <text class="l" x="625" y="54" text-anchor="middle">cache</text>
  <text class="i" x="625" y="70" text-anchor="middle">900</text>
  <path class="f" d="M340,56 H366"/>
  <path class="f" d="M520,56 H546"/>
  <path class="f" d="M730,56 H800 V128 H760"/>
  <rect class="b" x="760" y="106" width="110" height="44"/>
  <text class="l" x="815" y="133" text-anchor="middle">the network</text>
  <text class="k" x="450" y="176" text-anchor="middle">a hit at 900 returns here, and the network is never reached</text>
  <path class="fk" d="M700,78 V172 H560"/>
  <text class="n" x="60" y="226" text-anchor="start">on the way back</text>
  <text class="i" x="60" y="240" text-anchor="start">high order first</text>
  <rect class="s" x="550" y="214" width="150" height="44"/>
  <text class="l" x="625" y="234" text-anchor="middle">cache</text>
  <text class="i" x="625" y="250" text-anchor="middle">900</text>
  <rect class="b" x="370" y="214" width="150" height="44"/>
  <text class="l" x="445" y="234" text-anchor="middle">retry</text>
  <text class="i" x="445" y="250" text-anchor="middle">550</text>
  <rect class="b" x="190" y="214" width="150" height="44"/>
  <text class="l" x="265" y="234" text-anchor="middle">offsite</text>
  <text class="i" x="265" y="250" text-anchor="middle">500</text>
  <path class="f" d="M546,236 H524"/>
  <path class="f" d="M366,236 H344"/>
  <path class="f" d="M760,128 H720 V236 H704"/>
  <path class="f" d="M190,236 H120 V300 H300"/>
  <rect class="b" x="300" y="278" width="170" height="44"/>
  <text class="l" x="385" y="305" text-anchor="middle">response, to the spider</text>
  <text class="n" x="450" y="344" text-anchor="middle">a drop at offsite ends the request: nothing further out is called</text>

</svg>
