<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" role="img"
     aria-label="Reads are plain GETs that answer immediately. Work that runs for minutes answers 202 with a job id, which the caller then polls. Both go through one store.">
  <style>
    .b{fill:#f6f8fa;stroke:#57606a;stroke-width:1.5;rx:6}
    .s{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5;rx:6}
    .l{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1f2328}
    .m{font:11.5px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1f2328}
    .i{font:10.5px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#57606a}
    .n{font:11px -apple-system,system-ui,sans-serif;fill:#57606a}
    .f{stroke:#57606a;stroke-width:1.5;fill:none;marker-end:url(#a)}
    .k{stroke:#0969da;stroke-width:1.5;fill:none;stroke-dasharray:4 3;marker-end:url(#b)}
    .ah{fill:#57606a} .bh{fill:#0969da}
    @media (prefers-color-scheme:dark){
      .b{fill:#21262d;stroke:#8b949e} .s{fill:#0d2d4d;stroke:#58a6ff}
      .l,.m{fill:#e6edf3} .i,.n{fill:#8b949e} .f{stroke:#8b949e} .k{stroke:#58a6ff}
      .ah{fill:#8b949e} .bh{fill:#58a6ff}}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="bh" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <text class="n" x="440" y="24" text-anchor="middle">an HTTP request that blocks for minutes is one that times out somewhere in the middle, leaving the caller nothing to ask</text>

  <rect class="b" x="30" y="60" width="290" height="46"/>
  <text class="m" x="46" y="80">GET /v1/items/vehicle/records</text>
  <text class="i" x="46" y="97">a read</text>

  <rect class="b" x="30" y="228" width="290" height="46"/>
  <text class="m" x="46" y="248">POST /v1/items/vehicle/crawl</text>
  <text class="i" x="46" y="265">minutes of work</text>

  <rect class="s" x="380" y="132" width="180" height="70"/>
  <text class="l" x="470" y="158" text-anchor="middle">server</text>
  <text class="i" x="470" y="177" text-anchor="middle">/v1 · /mcp</text>
  <text class="i" x="470" y="193" text-anchor="middle">/metrics · /healthz</text>

  <path class="f" d="M320,86  C356,86  350,140 376,146"/>
  <path class="f" d="M320,248 C356,248 350,194 376,188"/>

  <path class="f" d="M560,146 C596,140 590,86 626,86"/>
  <path class="f" d="M560,188 C596,194 590,248 626,248"/>

  <rect class="b" x="630" y="60" width="220" height="46"/>
  <text class="l" x="646" y="80">200</text>
  <text class="i" x="646" y="97">with the rows</text>

  <rect class="b" x="630" y="228" width="220" height="46"/>
  <text class="l" x="646" y="248">202</text>
  <text class="i" x="646" y="265">{"id": "crawl-1"}</text>

  <rect class="b" x="630" y="296" width="220" height="42"/>
  <text class="m" x="646" y="322">GET /v1/jobs/crawl-1</text>

  <path class="f" d="M740,274 V292"/>
  <path class="k" d="M630,317 H570 V206"/>
  <text class="n" x="556" y="286" text-anchor="end">ask again, as often as you like</text>

  <text class="n" x="470" y="238" text-anchor="middle">one database, one</text>
  <text class="n" x="470" y="252" text-anchor="middle">set of models, one cache</text>

  <text class="n" x="440" y="362" text-anchor="middle">It is the same scour the command line drives, over a socket. An item defined through the API is the item the CLI sees,</text>
  <text class="n" x="440" y="376" text-anchor="middle">because both go through the store rather than through each other.</text>
</svg>
