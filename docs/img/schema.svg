<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" role="img"
     aria-label="A schema is a tree of props. The outer prop names the record; its children are the fields. Induction turns each into a locator, and extraction returns the same shape filled with values.">
  <style>
    .p    { fill: #dafbe1; stroke: #1a7f37; stroke-width: 1.5; rx: 5; }
    .l    { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; rx: 5; }
    .v    { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.5; rx: 5; }
    .t    { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1f2328; }
    .n    { font: 10px -apple-system, system-ui, sans-serif; fill: #57606a; }
    .h    { font: 600 12px -apple-system, system-ui, sans-serif; fill: #1f2328; }
    .e    { stroke: #57606a; stroke-width: 1.2; fill: none; }
    .a    { stroke: #57606a; stroke-width: 1.5; fill: none; marker-end: url(#m); }
    @media (prefers-color-scheme: dark) {
      .p{fill:#0f2f17;stroke:#3fb950;} .l{fill:#3b2300;stroke:#d29922;} .v{fill:#0d2d4d;stroke:#58a6ff;}
      .t,.h{fill:#e6edf3;} .n{fill:#8b949e;} .e,.a{stroke:#8b949e;}
    }
  </style>
  <defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>

  <text class="h" x="118" y="24" text-anchor="middle">what you declare</text>
  <text class="h" x="440" y="24" text-anchor="middle">what induction finds</text>
  <text class="h" x="762" y="24" text-anchor="middle">what extraction returns</text>

  <rect class="p" x="28" y="44" width="180" height="34"/><text class="t" x="118" y="66" text-anchor="middle">Prop "article"</text>
  <rect class="p" x="64" y="92" width="144" height="30"/><text class="t" x="136" y="112" text-anchor="middle">title</text>
  <rect class="p" x="64" y="128" width="144" height="30"/><text class="t" x="136" y="148" text-anchor="middle">author</text>
  <rect class="p" x="64" y="164" width="144" height="30"/><text class="t" x="136" y="184" text-anchor="middle">published</text>
  <text class="n" x="118" y="214" text-anchor="middle">each carries examples, aliases,</text>
  <text class="n" x="118" y="228" text-anchor="middle">a type, and optional patterns</text>
  <path class="e" d="M46,78 V107 H64 M46,107 V143 H64 M46,143 V179 H64"/>

  <rect class="l" x="350" y="44" width="180" height="34"/><text class="t" x="440" y="66" text-anchor="middle">container locator</text>
  <rect class="l" x="386" y="92" width="144" height="30"/><text class="t" x="458" y="112" text-anchor="middle">title locator</text>
  <rect class="l" x="386" y="128" width="144" height="30"/><text class="t" x="458" y="148" text-anchor="middle">author locator</text>
  <rect class="l" x="386" y="164" width="144" height="30"/><text class="t" x="458" y="184" text-anchor="middle">published locator</text>
  <text class="n" x="440" y="214" text-anchor="middle">xpath, css and json path for one node,</text>
  <text class="n" x="440" y="228" text-anchor="middle">plus a regex and a URL pattern</text>
  <text class="n" x="440" y="248" text-anchor="middle">children are addressed relative to the container</text>
  <path class="e" d="M368,78 V107 H386 M368,107 V143 H386 M368,143 V179 H386"/>

  <rect class="v" x="672" y="44" width="180" height="34"/><text class="t" x="762" y="66" text-anchor="middle">record</text>
  <rect class="v" x="708" y="92" width="144" height="30"/><text class="t" x="780" y="112" text-anchor="middle">title = "..."</text>
  <rect class="v" x="708" y="128" width="144" height="30"/><text class="t" x="780" y="148" text-anchor="middle">author = "..."</text>
  <rect class="v" x="708" y="164" width="144" height="30"/><text class="t" x="780" y="184" text-anchor="middle">published = "..."</text>
  <text class="n" x="762" y="214" text-anchor="middle">one record per container the</text>
  <text class="n" x="762" y="228" text-anchor="middle">locator matched, on every page</text>
  <path class="e" d="M690,78 V107 H708 M690,107 V143 H708 M690,143 V179 H708"/>

  <path class="a" d="M212,61 H344"/><text class="n" x="278" y="52" text-anchor="middle">induce</text>
  <path class="a" d="M534,61 H666"/><text class="n" x="600" y="52" text-anchor="middle">extract</text>

  <text class="n" x="440" y="306" text-anchor="middle">The three shapes are the same tree. A schema nests, so its locators nest, so its records nest.</text>
  <text class="n" x="440" y="326" text-anchor="middle">The container is chosen first, and only then are the fields fixed inside it: choosing a field's</text>
  <text class="n" x="440" y="340" text-anchor="middle">home before the record's turned 45 articles into 1 on a feed.</text>
  <text class="n" x="440" y="372" text-anchor="middle">A prop may itself hold props, so a record can contain records. Depth is not limited by the model,</text>
  <text class="n" x="440" y="386" text-anchor="middle">only by what a page actually repeats.</text>
</svg>
