<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 372" role="img"
     aria-label="On one machine a directory holds the fetched bodies and the trainer reads it back. With crawlers on several machines each would write to its own disk, so they are pointed at one bucket instead.">
  <style>
    .b{fill:#f6f8fa;stroke:#57606a;stroke-width:1.5;rx:6}
    .s{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5;rx:6}
    .l{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1f2328}
    .i{font:10.5px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#57606a}
    .n{font:11px -apple-system,system-ui,sans-serif;fill:#57606a}
    .h{font:600 12px -apple-system,system-ui,sans-serif;fill:#1f2328}
    .f{stroke:#57606a;stroke-width:1.5;fill:none;marker-end:url(#a)}
    .ah{fill:#57606a}
    .sep{stroke:#d0d7de;stroke-width:1}
    @media (prefers-color-scheme:dark){
      .b{fill:#21262d;stroke:#8b949e} .s{fill:#0d2d4d;stroke:#58a6ff}
      .l,.h{fill:#e6edf3} .i,.n{fill:#8b949e} .f{stroke:#8b949e} .ah{fill:#8b949e}
      .sep{stroke:#30363d}}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <text class="n" x="440" y="22" text-anchor="middle">the database records that a page was fetched and what its key is; the body itself is kept separately</text>

  <line class="sep" x1="440" y1="44" x2="440" y2="300"/>

  <text class="h" x="220" y="62" text-anchor="middle">one machine</text>
  <text class="h" x="660" y="62" text-anchor="middle">crawlers on several</text>

  <rect class="b" x="140" y="80" width="160" height="44"/>
  <text class="l" x="220" y="107" text-anchor="middle">crawl</text>
  <path class="f" d="M220,124 V162"/>

  <rect class="s" x="140" y="166" width="160" height="52"/>
  <text class="l" x="220" y="187" text-anchor="middle">local</text>
  <text class="i" x="220" y="204" text-anchor="middle">a directory</text>
  <path class="f" d="M220,218 V256"/>

  <rect class="b" x="140" y="260" width="160" height="44"/>
  <text class="l" x="220" y="287" text-anchor="middle">train</text>

  <rect class="b" x="520" y="80" width="120" height="44"/>
  <text class="l" x="580" y="107" text-anchor="middle">crawl</text>
  <rect class="b" x="680" y="80" width="120" height="44"/>
  <text class="l" x="740" y="107" text-anchor="middle">crawl</text>

  <path class="f" d="M580,124 C580,146 640,144 655,162"/>
  <path class="f" d="M740,124 C740,146 680,144 665,162"/>

  <rect class="s" x="580" y="166" width="160" height="52"/>
  <text class="l" x="660" y="187" text-anchor="middle">s3 · gcs</text>
  <text class="i" x="660" y="204" text-anchor="middle">one bucket</text>
  <path class="f" d="M660,218 V256"/>

  <rect class="b" x="580" y="260" width="160" height="44"/>
  <text class="l" x="660" y="287" text-anchor="middle">train</text>

  <text class="n" x="440" y="330" text-anchor="middle">Fetched bodies are the only part of scour's state that does not have to be local. Point crawlers at their own disks</text>
  <text class="n" x="440" y="348" text-anchor="middle">and the trainer reads an empty cache with a database full of keys pointing at nothing.</text>
  <text class="n" x="440" y="366" text-anchor="middle">The object stores are behind a build tag, because their SDKs cost more than most crawls are willing to link.</text>
</svg>
