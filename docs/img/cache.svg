<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img"
     aria-label="A URL is hashed to a key. The key holds the body exactly as the server sent it, and the same key with a dot-meta suffix holds the status, final URL, headers and fetch time. Reading back requires both; decoding uses the headers from the sidecar.">
  <style>
    .b{fill:#f6f8fa;stroke:#57606a;stroke-width:1.5;rx:6}
    .s{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5;rx:6}
    .g{fill:none;stroke:#d0d7de;stroke-width:1.5;stroke-dasharray:4 3;rx:8}
    .l{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1f2328}
    .i{font:10.5px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#57606a}
    .n{font:11px -apple-system,system-ui,sans-serif;fill:#57606a}
    .k{font:11px -apple-system,system-ui,sans-serif;fill:#0969da}
    .f{stroke:#57606a;stroke-width:1.5;fill:none;marker-end:url(#a)}
    .fk{stroke:#0969da;stroke-width:1.5;fill:none;marker-end:url(#ak)}
    .fd{stroke:#57606a;stroke-width:1.5;fill:none;stroke-dasharray:4 3}
    .ah{fill:#57606a}
    .ak{fill:#0969da}
    @media (prefers-color-scheme:dark){
      .b{fill:#21262d;stroke:#8b949e} .s{fill:#0d2d4d;stroke:#58a6ff}
      .g{stroke:#30363d}
      .l{fill:#e6edf3} .i,.n{fill:#8b949e} .k{fill:#58a6ff}
      .f{stroke:#8b949e} .fd{stroke:#8b949e} .ah{fill:#8b949e}
      .fk{stroke:#58a6ff} .ak{fill:#58a6ff}}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="ak" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <text class="n" x="450" y="18" text-anchor="middle">one page, two keys, and a hit needs both</text>
  <rect class="b" x="300" y="36" width="300" height="44"/>
  <text class="l" x="450" y="63" text-anchor="middle">https://example.com/story</text>
  <path class="f" d="M450,80 V112"/>
  <rect class="s" x="330" y="112" width="240" height="40"/>
  <text class="l" x="450" y="137" text-anchor="middle">one key, from the normalised URL</text>
  <path class="f" d="M400,152 V186 H250"/>
  <path class="f" d="M500,152 V186 H650"/>
  <rect class="b" x="60" y="186" width="380" height="62"/>
  <text class="l" x="250" y="215" text-anchor="middle">key</text>
  <text class="i" x="250" y="231" text-anchor="middle">the bytes as the server sent them</text>
  <rect class="s" x="560" y="186" width="300" height="62"/>
  <text class="l" x="710" y="215" text-anchor="middle">key + .meta</text>
  <text class="i" x="710" y="231" text-anchor="middle">status, final URL, headers, when</text>
  <text class="i" x="250" y="268" text-anchor="middle">written first</text>
  <text class="i" x="710" y="268" text-anchor="middle">written second, read first</text>
  <path class="f" d="M250,248 V296 H420"/>
  <path class="f" d="M710,248 V296 H480"/>
  <rect class="s" x="360" y="296" width="180" height="44"/>
  <text class="l" x="450" y="323" text-anchor="middle">a hit needs both</text>
  <path class="f" d="M450,340 V372"/>
  <rect class="b" x="300" y="372" width="300" height="44"/>
  <text class="l" x="450" y="399" text-anchor="middle">text, decoded now</text>
  <text class="i" x="450" y="404" text-anchor="middle">using the headers kept beside the body</text>
  <text class="n" x="450" y="444" text-anchor="middle">a half-written entry is a clean miss, never a body nobody can decode</text>

</svg>
