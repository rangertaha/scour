<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 424" role="img"
     aria-label="The four stages above the stores they touch. The scheduler holds the frontier in SQLite and the pipeline holds records in SQLite, and they share no file. The downloader and the spider touch no database at all, only the shared cache. The entity graph and the event log sit behind one process, scour service, because two stages need them and a file cannot have two owners. Jobs, run state, secrets and nodes live in NATS key-value buckets, which is the one store every node already has.">
  <style>
    .b{fill:#f6f8fa;stroke:#57606a;stroke-width:1.5;rx:6}
    .s{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5;rx:6}
    .g{fill:none;stroke:#d0d7de;stroke-width:1.5;stroke-dasharray:4 3;rx:8}
    .l{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1f2328}
    .i{font:10.5px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#57606a}
    .n{font:11px -apple-system,system-ui,sans-serif;fill:#57606a}
    .k{font:11px -apple-system,system-ui,sans-serif;fill:#0969da}
    .f{stroke:#57606a;stroke-width:1.5;fill:none;marker-end:url(#a)}
    .fk{stroke:#0969da;stroke-width:1.5;fill:none;marker-end:url(#ak)}
    .fd{stroke:#57606a;stroke-width:1.5;fill:none;stroke-dasharray:4 3}
    .ah{fill:#57606a}
    .ak{fill:#0969da}
    @media (prefers-color-scheme:dark){
      .b{fill:#21262d;stroke:#8b949e} .s{fill:#0d2d4d;stroke:#58a6ff}
      .g{stroke:#30363d}
      .l{fill:#e6edf3} .i,.n{fill:#8b949e} .k{fill:#58a6ff}
      .f{stroke:#8b949e} .fd{stroke:#8b949e} .ah{fill:#8b949e}
      .fk{stroke:#58a6ff} .ak{fill:#58a6ff}}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="ak" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <text class="n" x="450" y="18" text-anchor="middle">the two stages that touch a database touch different ones</text>
  <rect class="s" x="40" y="34" width="170" height="44"/>
  <text class="l" x="125" y="61" text-anchor="middle">SCHEDULER</text>
  <rect class="b" x="250" y="34" width="170" height="44"/>
  <text class="l" x="335" y="61" text-anchor="middle">DOWNLOADER</text>
  <rect class="b" x="460" y="34" width="170" height="44"/>
  <text class="l" x="545" y="61" text-anchor="middle">SPIDER</text>
  <rect class="s" x="670" y="34" width="170" height="44"/>
  <text class="l" x="755" y="61" text-anchor="middle">PIPELINE</text>
  <path class="f" d="M125,78 V112"/>
  <rect class="b" x="40" y="112" width="170" height="56"/>
  <text class="l" x="125" y="138" text-anchor="middle">frontier + hosts</text>
  <text class="i" x="125" y="154" text-anchor="middle">SQLite, one, shared</text>
  <path class="f" d="M755,78 V112"/>
  <rect class="b" x="670" y="112" width="170" height="56"/>
  <text class="l" x="755" y="138" text-anchor="middle">records + marks</text>
  <text class="i" x="755" y="154" text-anchor="middle">SQLite, one per job</text>
  <path class="f" d="M335,78 V96 H400 V112"/>
  <path class="f" d="M545,78 V96 H480 V112"/>
  <rect class="b" x="310" y="112" width="260" height="56"/>
  <text class="l" x="440" y="138" text-anchor="middle">the cache</text>
  <text class="i" x="440" y="154" text-anchor="middle">a directory, S3 or GCS</text>
  <text class="i" x="440" y="196" text-anchor="middle">the two in the middle touch no database at all</text>
  <path class="f" d="M755,168 V212 H520 V230"/>
  <path class="f" d="M545,78 V90 H860 V230 H740"/>
  <rect class="s" x="360" y="230" width="320" height="46"/>
  <text class="l" x="520" y="258" text-anchor="middle">scour service</text>
  <path class="f" d="M440,276 V310"/>
  <path class="f" d="M600,276 V310"/>
  <rect class="b" x="300" y="310" width="160" height="50"/>
  <text class="l" x="380" y="333" text-anchor="middle">entity graph</text>
  <text class="i" x="380" y="349" text-anchor="middle">SQLite, one owner</text>
  <rect class="b" x="520" y="310" width="160" height="50"/>
  <text class="l" x="600" y="333" text-anchor="middle">event log</text>
  <text class="i" x="600" y="349" text-anchor="middle">SQLite, one owner</text>
  <rect class="s" x="40" y="310" width="220" height="50"/>
  <text class="l" x="150" y="332" text-anchor="middle">NATS KV</text>
  <text class="i" x="150" y="348" text-anchor="middle">jobs · runs · secrets · nodes</text>
  <text class="n" x="450" y="392" text-anchor="middle">a laptop needs nothing installed: an embedded broker, a directory of bodies,</text>
  <text class="n" x="450" y="408" text-anchor="middle">and a SQLite file per store a crawl actually asks for</text>

</svg>
