<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" role="img"
     aria-label="A request goes to plain HTTP unless the host is already known to need a browser. A response that looks unrendered escalates to the webdriver transport, and the host is remembered so the wasted HTTP attempt is skipped next time. Both paths produce one kind of response.">
  <style>
    .b{fill:#f6f8fa;stroke:#57606a;stroke-width:1.5;rx:6}
    .s{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5;rx:6}
    .d{fill:#f6f8fa;stroke:#57606a;stroke-width:1.5;stroke-dasharray:4 3;rx:6}
    .l{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1f2328}
    .i{font:10.5px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#57606a}
    .n{font:11px -apple-system,system-ui,sans-serif;fill:#57606a}
    .f{stroke:#57606a;stroke-width:1.5;fill:none;marker-end:url(#a)}
    .k{stroke:#0969da;stroke-width:1.5;fill:none;stroke-dasharray:4 3;marker-end:url(#b)}
    .ah{fill:#57606a} .bh{fill:#0969da}
    @media (prefers-color-scheme:dark){
      .b,.d{fill:#21262d;stroke:#8b949e} .s{fill:#0d2d4d;stroke:#58a6ff}
      .l{fill:#e6edf3} .i,.n{fill:#8b949e} .f{stroke:#8b949e} .k{stroke:#58a6ff}
      .ah{fill:#8b949e} .bh{fill:#58a6ff}}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="bh" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <text class="n" x="440" y="24" text-anchor="middle">the extension point is http.RoundTripper, so a plugin that satisfies the standard library satisfies scour</text>

  <rect class="b" x="30" y="110" width="150" height="48"/>
  <text class="l" x="105" y="131" text-anchor="middle">request</text>
  <text class="i" x="105" y="147" text-anchor="middle">from colly</text>

  <rect class="d" x="220" y="110" width="190" height="48"/>
  <text class="l" x="315" y="131" text-anchor="middle">known to need one?</text>
  <text class="i" x="315" y="147" text-anchor="middle">per host, remembered</text>

  <rect class="b" x="450" y="46" width="160" height="48"/>
  <text class="l" x="530" y="67" text-anchor="middle">http</text>
  <text class="i" x="530" y="83" text-anchor="middle">a socket</text>

  <rect class="d" x="450" y="122" width="160" height="56"/>
  <text class="l" x="530" y="143" text-anchor="middle">unrendered?</text>
  <text class="i" x="530" y="159" text-anchor="middle">scripts, no links,</text>
  <text class="i" x="530" y="172" text-anchor="middle">almost no text</text>

  <rect class="b" x="450" y="210" width="160" height="48"/>
  <text class="l" x="530" y="231" text-anchor="middle">webdriver</text>
  <text class="i" x="530" y="247" text-anchor="middle">a browser tab</text>

  <rect class="s" x="680" y="110" width="170" height="48"/>
  <text class="l" x="765" y="131" text-anchor="middle">response</text>
  <text class="i" x="765" y="147" text-anchor="middle">one kind, downstream</text>

  <path class="f" d="M180,134 H216"/>
  <path class="f" d="M410,134 C432,134 428,70 446,70"/>
  <path class="f" d="M410,134 C432,134 428,234 446,234"/>
  <text class="n" x="428" y="104" text-anchor="middle">no</text>
  <text class="n" x="428" y="196" text-anchor="middle">yes</text>

  <path class="f" d="M530,94 V118"/>
  <path class="f" d="M530,178 V206"/>
  <text class="n" x="560" y="196" text-anchor="start">all three, or it is fine</text>

  <path class="f" d="M610,70 C652,70 650,134 676,134"/>
  <path class="f" d="M610,234 C652,234 650,134 676,134"/>

  <path class="k" d="M450,246 H330 V162"/>
  <text class="n" x="330" y="266" text-anchor="middle">learned once, then the HTTP attempt is skipped</text>

  <text class="n" x="440" y="316" text-anchor="middle">Rendering happens here, below everything else, so a rendered page is cached, scored, trained on and searched</text>
  <text class="n" x="440" y="334" text-anchor="middle">exactly like any other. There is no second code path for JavaScript sites.</text>
  <text class="n" x="440" y="368" text-anchor="middle">If the browser will not start, the crawl keeps the plain response and carries on.</text>
</svg>
