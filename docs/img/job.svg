<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 296" role="img"
     aria-label="A job block holding an item block, three stage blocks and an exporter. Inside a stage block, attributes such as robots, timeout and rate are plain settings, and a nested plugin block is a separate thing that was added to it.">
  <style>
    .b{fill:#f6f8fa;stroke:#57606a;stroke-width:1.5;rx:6}
    .s{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5;rx:6}
    .g{fill:none;stroke:#d0d7de;stroke-width:1.5;stroke-dasharray:4 3;rx:8}
    .l{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1f2328}
    .i{font:10.5px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#57606a}
    .n{font:11px -apple-system,system-ui,sans-serif;fill:#57606a}
    .k{font:11px -apple-system,system-ui,sans-serif;fill:#0969da}
    .f{stroke:#57606a;stroke-width:1.5;fill:none;marker-end:url(#a)}
    .fk{stroke:#0969da;stroke-width:1.5;fill:none;marker-end:url(#ak)}
    .fd{stroke:#57606a;stroke-width:1.5;fill:none;stroke-dasharray:4 3}
    .ah{fill:#57606a}
    .ak{fill:#0969da}
    @media (prefers-color-scheme:dark){
      .b{fill:#21262d;stroke:#8b949e} .s{fill:#0d2d4d;stroke:#58a6ff}
      .g{stroke:#30363d}
      .l{fill:#e6edf3} .i,.n{fill:#8b949e} .k{fill:#58a6ff}
      .f{stroke:#8b949e} .fd{stroke:#8b949e} .ah{fill:#8b949e}
      .fk{stroke:#58a6ff} .ak{fill:#58a6ff}}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="ak" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <text class="n" x="450" y="18" text-anchor="middle">every block optional except the items and the start URLs</text>
  <rect class="g" x="24" y="30" width="852" height="250"/>
  <text class="l" x="60" y="50" text-anchor="start">job "news"</text>
  <text class="i" x="200" y="50" text-anchor="start">scope, and everything below it</text>
  <rect class="s" x="48" y="62" width="380" height="96"/>
  <text class="l" x="238" y="115" text-anchor="middle">item "article"</text>
  <text class="i" x="238" y="104" text-anchor="middle">property title · property author</text>
  <text class="i" x="238" y="120" text-anchor="middle">relation publisher</text>
  <text class="n" x="238" y="142" text-anchor="middle">what to extract</text>
  <rect class="b" x="452" y="62" width="400" height="96"/>
  <text class="l" x="652" y="115" text-anchor="middle">downloader</text>
  <text class="i" x="652" y="104" text-anchor="middle">robots · timeout · max_redirects</text>
  <text class="k" x="652" y="128" text-anchor="middle">plugin cache { ... }</text>
  <text class="n" x="652" y="148" text-anchor="middle">attributes, and a nested plugin</text>
  <rect class="b" x="48" y="172" width="380" height="92"/>
  <text class="l" x="238" y="223" text-anchor="middle">scheduler</text>
  <text class="i" x="238" y="212" text-anchor="middle">policy · rate · max_depth · max_pages</text>
  <text class="k" x="238" y="234" text-anchor="middle">plugin dupefilter {}</text>
  <text class="n" x="238" y="252" text-anchor="middle">an attribute is always on; a plugin was added</text>
  <rect class="b" x="452" y="172" width="400" height="92"/>
  <text class="l" x="652" y="223" text-anchor="middle">pipeline · exporter</text>
  <text class="i" x="652" y="212" text-anchor="middle">step clean article · step rank article</text>
  <text class="i" x="652" y="230" text-anchor="middle">exporter json article</text>
  <text class="n" x="652" y="252" text-anchor="middle">one exporter per item</text>

</svg>
