<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img"
     aria-label="One item declaration becomes three things: a record with named properties, edges to entities in a shared store, and a measurement whose tags are the entity references and whose fields are the remaining properties.">
  <style>
    .b{fill:#f6f8fa;stroke:#57606a;stroke-width:1.5;rx:6}
    .s{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5;rx:6}
    .g{fill:none;stroke:#d0d7de;stroke-width:1.5;stroke-dasharray:4 3;rx:8}
    .l{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1f2328}
    .i{font:10.5px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#57606a}
    .n{font:11px -apple-system,system-ui,sans-serif;fill:#57606a}
    .k{font:11px -apple-system,system-ui,sans-serif;fill:#0969da}
    .f{stroke:#57606a;stroke-width:1.5;fill:none;marker-end:url(#a)}
    .fk{stroke:#0969da;stroke-width:1.5;fill:none;marker-end:url(#ak)}
    .fd{stroke:#57606a;stroke-width:1.5;fill:none;stroke-dasharray:4 3}
    .ah{fill:#57606a}
    .ak{fill:#0969da}
    @media (prefers-color-scheme:dark){
      .b{fill:#21262d;stroke:#8b949e} .s{fill:#0d2d4d;stroke:#58a6ff}
      .g{stroke:#30363d}
      .l{fill:#e6edf3} .i,.n{fill:#8b949e} .k{fill:#58a6ff}
      .f{stroke:#8b949e} .fd{stroke:#8b949e} .ah{fill:#8b949e}
      .fk{stroke:#58a6ff} .ak{fill:#58a6ff}}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="ak" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <text class="n" x="450" y="18" text-anchor="middle">one model, three renderings</text>
  <rect class="s" x="300" y="34" width="300" height="66"/>
  <text class="l" x="450" y="72" text-anchor="middle">item price</text>
  <text class="i" x="450" y="76" text-anchor="middle">of = company, time = observed</text>
  <text class="i" x="450" y="90" text-anchor="middle">property value, property observed</text>
  <path class="f" d="M360,100 V140 H180 V168"/>
  <path class="f" d="M450,100 V168"/>
  <path class="f" d="M540,100 V140 H720 V168"/>
  <rect class="b" x="40" y="168" width="280" height="74"/>
  <text class="l" x="180" y="210" text-anchor="middle">a record</text>
  <text class="i" x="180" y="210" text-anchor="middle">named properties, some nested,</text>
  <text class="i" x="180" y="224" text-anchor="middle">as somebody asked for them</text>
  <rect class="b" x="340" y="168" width="220" height="74"/>
  <text class="l" x="450" y="210" text-anchor="middle">assertions</text>
  <text class="i" x="450" y="210" text-anchor="middle">this page said this company</text>
  <text class="i" x="450" y="224" text-anchor="middle">has this price, at this time</text>
  <rect class="b" x="580" y="168" width="280" height="74"/>
  <text class="l" x="720" y="210" text-anchor="middle">a measurement</text>
  <text class="i" x="720" y="210" text-anchor="middle">name, tags, fields, time</text>
  <path class="f" d="M180,242 V284"/>
  <path class="f" d="M450,242 V284"/>
  <path class="f" d="M720,242 V284"/>
  <rect class="b" x="60" y="284" width="240" height="42"/>
  <text class="l" x="180" y="310" text-anchor="middle">json, csv, sqlite</text>
  <rect class="s" x="360" y="284" width="180" height="42"/>
  <text class="l" x="450" y="310" text-anchor="middle">the entity graph</text>
  <rect class="b" x="600" y="284" width="240" height="42"/>
  <text class="l" x="720" y="310" text-anchor="middle">nats, and the archive</text>
  <text class="n" x="450" y="358" text-anchor="middle">tags are `of` and the relations, because an entity reference is bounded by</text>
  <text class="n" x="450" y="374" text-anchor="middle">definition; fields are everything else</text>

</svg>
