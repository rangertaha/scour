<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 304" role="img"
     aria-label="Three nested rings of commands. The innermost holds init, validate, show, spec and defaults, which need nothing but the document. Around it, try, run, train and topic, which need a directory on this machine for the cache and the frontier. Around those, serve, service and secret, which need a cluster. A command in an outer ring needs everything in the rings inside it.">
  <style>
    .b{fill:#f6f8fa;stroke:#57606a;stroke-width:1.5;rx:6}
    .s{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5;rx:6}
    .g{fill:none;stroke:#d0d7de;stroke-width:1.5;stroke-dasharray:4 3;rx:8}
    .l{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1f2328}
    .i{font:10.5px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#57606a}
    .n{font:11px -apple-system,system-ui,sans-serif;fill:#57606a}
    .k{font:11px -apple-system,system-ui,sans-serif;fill:#0969da}
    .f{stroke:#57606a;stroke-width:1.5;fill:none;marker-end:url(#a)}
    .fk{stroke:#0969da;stroke-width:1.5;fill:none;marker-end:url(#ak)}
    .fd{stroke:#57606a;stroke-width:1.5;fill:none;stroke-dasharray:4 3}
    .ah{fill:#57606a}
    .ak{fill:#0969da}
    @media (prefers-color-scheme:dark){
      .b{fill:#21262d;stroke:#8b949e} .s{fill:#0d2d4d;stroke:#58a6ff}
      .g{stroke:#30363d}
      .l{fill:#e6edf3} .i,.n{fill:#8b949e} .k{fill:#58a6ff}
      .f{stroke:#8b949e} .fd{stroke:#8b949e} .ah{fill:#8b949e}
      .fk{stroke:#58a6ff} .ak{fill:#58a6ff}}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="ak" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <text class="n" x="450" y="20" text-anchor="middle">what has to exist before a command can work</text>
  <rect class="g" x="30" y="34" width="840" height="228"/>
  <text class="n" x="450" y="56" text-anchor="middle">needs a cluster: a broker, and whatever it is keeping for you</text>
  <rect class="g" x="70" y="68" width="760" height="160"/>
  <text class="n" x="450" y="90" text-anchor="middle">needs a directory here: the cache, and a frontier of its own</text>
  <rect class="s" x="110" y="102" width="680" height="92"/>
  <text class="n" x="450" y="124" text-anchor="middle">needs nothing but the document</text>
  <text class="l" x="450" y="148" text-anchor="middle">init · validate · show · spec · defaults</text>
  <text class="i" x="450" y="170" text-anchor="middle">offline, in CI, on a plane</text>
  <text class="l" x="450" y="216" text-anchor="middle">try · run · train · topic</text>
  <text class="l" x="450" y="250" text-anchor="middle">serve · service · secret</text>
  <text class="n" x="450" y="288" text-anchor="middle">a command in an outer ring needs everything in the rings inside it</text>

</svg>
