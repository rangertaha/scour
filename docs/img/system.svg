<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img"
     aria-label="Three interfaces, a command line, an HTTP API and MCP, all sit on one broker. The components crawl, parse, train, score, classify and export publish and subscribe on it. Two durable stores sit underneath: the database and the page cache.">
  <style>
    .b{fill:#f6f8fa;stroke:#57606a;stroke-width:1.5;rx:6}
    .s{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5;rx:6}
    .bus{fill:#ddf4ff;stroke:#0969da;stroke-width:2;rx:8}
    .l{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1f2328}
    .i{font:10.5px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#57606a}
    .n{font:11px -apple-system,system-ui,sans-serif;fill:#57606a}
    .f{stroke:#57606a;stroke-width:1.5;fill:none;marker-end:url(#a)}
    .ah{fill:#57606a}
    @media (prefers-color-scheme:dark){
      .b{fill:#21262d;stroke:#8b949e} .s,.bus{fill:#0d2d4d;stroke:#58a6ff}
      .l{fill:#e6edf3} .i,.n{fill:#8b949e} .f{stroke:#8b949e} .ah{fill:#8b949e}}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <text class="n" x="450" y="16" text-anchor="middle">three ways in, one scour behind them</text>

  <rect class="b" x="155" y="28" width="170" height="46"/>
  <text class="l" x="240" y="49" text-anchor="middle">scour</text>
  <text class="i" x="240" y="65" text-anchor="middle">command line</text>

  <rect class="b" x="365" y="28" width="170" height="46"/>
  <text class="l" x="450" y="49" text-anchor="middle">scour server</text>
  <text class="i" x="450" y="65" text-anchor="middle">HTTP API</text>

  <rect class="b" x="575" y="28" width="170" height="46"/>
  <text class="l" x="660" y="49" text-anchor="middle">scour mcp</text>
  <text class="i" x="660" y="65" text-anchor="middle">agents</text>

  <path class="f" d="M240,74 V108"/>
  <path class="f" d="M450,74 V108"/>
  <path class="f" d="M660,74 V108"/>

  <rect class="bus" x="60" y="112" width="780" height="44"/>
  <text class="l" x="450" y="132" text-anchor="middle">bus</text>
  <text class="i" x="450" y="148" text-anchor="middle">NATS + JetStream, embedded in-process by default</text>

  <path class="f" d="M125,156 V186"/>
  <path class="f" d="M255,156 V186"/>
  <path class="f" d="M385,156 V186"/>
  <path class="f" d="M515,156 V186"/>
  <path class="f" d="M645,156 V186"/>
  <path class="f" d="M775,156 V186"/>

  <rect class="b" x="68" y="190" width="115" height="52"/>
  <text class="l" x="125" y="211" text-anchor="middle">crawl</text>
  <text class="i" x="125" y="228" text-anchor="middle">fetches</text>

  <rect class="b" x="198" y="190" width="115" height="52"/>
  <text class="l" x="255" y="211" text-anchor="middle">parse</text>
  <text class="i" x="255" y="228" text-anchor="middle">one graph</text>

  <rect class="b" x="328" y="190" width="115" height="52"/>
  <text class="l" x="385" y="211" text-anchor="middle">train</text>
  <text class="i" x="385" y="228" text-anchor="middle">induces rules</text>

  <rect class="b" x="458" y="190" width="115" height="52"/>
  <text class="l" x="515" y="211" text-anchor="middle">score</text>
  <text class="i" x="515" y="228" text-anchor="middle">ranks URLs</text>

  <rect class="b" x="588" y="190" width="115" height="52"/>
  <text class="l" x="645" y="211" text-anchor="middle">classify</text>
  <text class="i" x="645" y="228" text-anchor="middle">reads pages</text>

  <rect class="b" x="718" y="190" width="115" height="52"/>
  <text class="l" x="775" y="211" text-anchor="middle">export</text>
  <text class="i" x="775" y="228" text-anchor="middle">hands off</text>

  <text class="n" x="450" y="268" text-anchor="middle">components never call each other: they publish and subscribe, so the same code is one process or many machines</text>

  <path class="f" d="M255,242 V292"/>
  <path class="f" d="M645,242 V292"/>

  <rect class="s" x="150" y="296" width="240" height="52"/>
  <text class="l" x="270" y="317" text-anchor="middle">store</text>
  <text class="i" x="270" y="334" text-anchor="middle">items · frontier · rules · records</text>

  <rect class="s" x="510" y="296" width="240" height="52"/>
  <text class="l" x="630" y="317" text-anchor="middle">cache</text>
  <text class="i" x="630" y="334" text-anchor="middle">page bodies, local or object store</text>

  <text class="n" x="450" y="382" text-anchor="middle">blue is durable state. Everything above it can be restarted, moved to another machine, or replaced.</text>
  <text class="n" x="450" y="402" text-anchor="middle">Every grey box named twice above is an extension point: one interface, several implementations, chosen by name in config.</text>
</svg>
