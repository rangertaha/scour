<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 285" role="img"
     aria-label="Requests flow from the scheduler to the downloader to the spider to the pipeline and out to exporters, with new requests looping from the spider back to the scheduler. Between the downloader and the spider only a cache key crosses; the body itself goes down into the shared cache and back up.">
  <style>
    .b{fill:#f6f8fa;stroke:#57606a;stroke-width:1.5;rx:6}
    .s{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5;rx:6}
    .g{fill:none;stroke:#d0d7de;stroke-width:1.5;stroke-dasharray:4 3;rx:8}
    .l{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1f2328}
    .i{font:10.5px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#57606a}
    .n{font:11px -apple-system,system-ui,sans-serif;fill:#57606a}
    .k{font:11px -apple-system,system-ui,sans-serif;fill:#0969da}
    .f{stroke:#57606a;stroke-width:1.5;fill:none;marker-end:url(#a)}
    .fk{stroke:#0969da;stroke-width:1.5;fill:none;marker-end:url(#ak)}
    .fd{stroke:#57606a;stroke-width:1.5;fill:none;stroke-dasharray:4 3}
    .ah{fill:#57606a}
    .ak{fill:#0969da}
    @media (prefers-color-scheme:dark){
      .b{fill:#21262d;stroke:#8b949e} .s{fill:#0d2d4d;stroke:#58a6ff}
      .g{stroke:#30363d}
      .l{fill:#e6edf3} .i,.n{fill:#8b949e} .k{fill:#58a6ff}
      .f{stroke:#8b949e} .fd{stroke:#8b949e} .ah{fill:#8b949e}
      .fk{stroke:#58a6ff} .ak{fill:#58a6ff}}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="ak" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <text class="n" x="450" y="18" text-anchor="middle">one arrow points backwards, and it is the one that makes a focused crawl focused</text>
  <path class="fk" d="M470,104 V60 H104 V96"/>
  <text class="k" x="287" y="52" text-anchor="middle">every link, back to the queue</text>
  <rect class="s" x="34" y="100" width="140" height="54"/>
  <text class="l" x="104" y="125" text-anchor="middle">SCHEDULER</text>
  <text class="i" x="104" y="141" text-anchor="middle">the frontier</text>
  <rect class="b" x="220" y="100" width="140" height="54"/>
  <text class="l" x="290" y="125" text-anchor="middle">DOWNLOADER</text>
  <text class="i" x="290" y="141" text-anchor="middle">fetches</text>
  <rect class="b" x="406" y="100" width="140" height="54"/>
  <text class="l" x="476" y="125" text-anchor="middle">SPIDER</text>
  <text class="i" x="476" y="141" text-anchor="middle">extracts</text>
  <rect class="b" x="592" y="100" width="140" height="54"/>
  <text class="l" x="662" y="125" text-anchor="middle">PIPELINE</text>
  <text class="i" x="662" y="141" text-anchor="middle">a graph</text>
  <rect class="b" x="778" y="100" width="96" height="54"/>
  <text class="l" x="826" y="125" text-anchor="middle">EXPORTERS</text>
  <text class="i" x="826" y="141" text-anchor="middle">copies out</text>
  <path class="f" d="M174,127 H216"/>
  <text class="i" x="195" y="118" text-anchor="middle">request</text>
  <path class="f" d="M360,127 H402"/>
  <text class="i" x="381" y="118" text-anchor="middle">status + key</text>
  <path class="f" d="M546,127 H588"/>
  <text class="i" x="567" y="118" text-anchor="middle">items</text>
  <path class="f" d="M732,127 H774"/>
  <path class="fk" d="M290,154 V196 H344"/>
  <path class="fk" d="M428,196 H476 V156"/>
  <rect class="s" x="344" y="176" width="84" height="40"/>
  <text class="l" x="386" y="201" text-anchor="middle">CACHE</text>
  <text class="i" x="250" y="192" text-anchor="end">writes body</text>
  <text class="i" x="500" y="192" text-anchor="start">reads body</text>
  <path class="fd" d="M104,154 V206"/>
  <text class="i" x="104" y="222" text-anchor="middle">frontier db</text>
  <text class="i" x="104" y="236" text-anchor="middle">its own</text>
  <path class="fd" d="M662,154 V206"/>
  <text class="i" x="662" y="222" text-anchor="middle">records db</text>
  <text class="i" x="662" y="236" text-anchor="middle">its own</text>
  <text class="n" x="450" y="268" text-anchor="middle">a body never crosses the bus: the message carries the key, the reader fetches it</text>

</svg>
