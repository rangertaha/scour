<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" role="img"
     aria-label="Two layers rank a URL. A base scorer reads the tokens of the link itself and answers whether it looks like a record page. A hidden Markov chain reads the whole path back to the seed and answers whether it leads to one. The two are combined as independent evidence in odds form.">
  <style>
    .b{fill:#f6f8fa;stroke:#57606a;stroke-width:1.5;rx:6}
    .s{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5;rx:6}
    .l{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1f2328}
    .m{font:11.5px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1f2328}
    .i{font:10.5px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#57606a}
    .n{font:11px -apple-system,system-ui,sans-serif;fill:#57606a}
    .f{stroke:#57606a;stroke-width:1.5;fill:none;marker-end:url(#a)}
    .p{stroke:#57606a;stroke-width:1.2;fill:none}
    .ah{fill:#57606a}
    @media (prefers-color-scheme:dark){
      .b{fill:#21262d;stroke:#8b949e} .s{fill:#0d2d4d;stroke:#58a6ff}
      .l,.m{fill:#e6edf3} .i,.n{fill:#8b949e} .f,.p{stroke:#8b949e} .ah{fill:#8b949e}}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <text class="n" x="440" y="24" text-anchor="middle">the hub leading to a hundred records usually contains none itself, scores near zero, and never gets followed</text>

  <rect class="b" x="40" y="48" width="110" height="38"/>
  <text class="m" x="95" y="72" text-anchor="middle">seed</text>
  <rect class="b" x="190" y="48" width="110" height="38"/>
  <text class="m" x="245" y="72" text-anchor="middle">hub</text>
  <rect class="b" x="340" y="48" width="110" height="38"/>
  <text class="m" x="395" y="72" text-anchor="middle">page 2</text>
  <rect class="b" x="490" y="48" width="110" height="38"/>
  <text class="m" x="545" y="72" text-anchor="middle">hub</text>
  <rect class="s" x="640" y="48" width="110" height="38"/>
  <text class="m" x="695" y="72" text-anchor="middle">this link</text>

  <path class="f" d="M150,67 H186"/>
  <path class="f" d="M300,67 H336"/>
  <path class="f" d="M450,67 H486"/>
  <path class="f" d="M600,67 H636"/>

  <path class="p" d="M95,86 V112 M245,86 V112 M395,86 V112 M545,86 V112 M695,86 V112"/>
  <path class="p" d="M95,112 H695"/>
  <path class="f" d="M220,112 V166"/>
  <path class="f" d="M695,112 V166"/>

  <rect class="b" x="90" y="170" width="260" height="70"/>
  <text class="l" x="220" y="192" text-anchor="middle">crawl chain</text>
  <text class="i" x="220" y="211" text-anchor="middle">six roles over the parent path</text>
  <text class="i" x="220" y="228" text-anchor="middle">does this <tspan font-style="italic">lead</tspan> to one?</text>

  <rect class="b" x="530" y="170" width="260" height="70"/>
  <text class="l" x="660" y="192" text-anchor="middle">base scorer</text>
  <text class="i" x="660" y="211" text-anchor="middle">bayes · embed, on the tokens</text>
  <text class="i" x="660" y="228" text-anchor="middle">does this <tspan font-style="italic">look</tspan> like one?</text>

  <path class="f" d="M220,240 C220,268 300,268 336,272"/>
  <path class="f" d="M660,240 C660,268 580,268 544,272"/>

  <rect class="s" x="340" y="266" width="200" height="60"/>
  <text class="l" x="440" y="290" text-anchor="middle">0.71</text>
  <text class="i" x="440" y="310" text-anchor="middle">combined in odds form</text>

  <text class="n" x="440" y="356" text-anchor="middle">Neither is sufficient alone, so the two enter as independent evidence rather than one overruling the other.</text>
  <text class="n" x="440" y="382" text-anchor="middle">Scoring runs once per discovered link, millions of times over a large crawl, so it has to be cheap.</text>
</svg>
