<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" role="img"
     aria-label="The data model. An item owns its aliases, its properties which own their own aliases, and its jobs, which own the targets and content types. A crawl fills urls, responses, queue items and page roles. Training fills rules, which nest, and records which own values.">
  <style>
    .def  { fill: #dafbe1; stroke: #1a7f37; stroke-width: 1.5; rx: 5; }
    .crawl{ fill: #ddf4ff; stroke: #0969da; stroke-width: 1.5; rx: 5; }
    .learn{ fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; rx: 5; }
    .root { fill: #f6f8fa; stroke: #1f2328; stroke-width: 2; rx: 5; }
    .t    { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1f2328; }
    .n    { font: 10px -apple-system, system-ui, sans-serif; fill: #57606a; }
    .h    { font: 600 12px -apple-system, system-ui, sans-serif; }
    .edge { stroke: #57606a; stroke-width: 1.3; fill: none; }
    .own  { stroke: #57606a; stroke-width: 1.3; fill: none; marker-end: url(#d); }
    @media (prefers-color-scheme: dark) {
      .def{fill:#0f2f17;stroke:#3fb950;} .crawl{fill:#0d2d4d;stroke:#58a6ff;}
      .learn{fill:#3b2300;stroke:#d29922;} .root{fill:#21262d;stroke:#e6edf3;}
      .t{fill:#e6edf3;} .n{fill:#8b949e;} .edge,.own{stroke:#8b949e;}
    }
  </style>
  <defs><marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>

  <rect class="root" x="370" y="16" width="140" height="42"/>
  <text class="t" x="440" y="34" text-anchor="middle">item</text>
  <text class="n" x="440" y="49" text-anchor="middle">the thing you hunt</text>

  <text class="t h" x="120" y="92" text-anchor="middle" fill="#1a7f37">what you define</text>
  <text class="t h" x="440" y="92" text-anchor="middle" fill="#0969da">what the crawl fills</text>
  <text class="t h" x="762" y="92" text-anchor="middle" fill="#9a6700">what training fills</text>

  <rect class="def" x="20" y="108" width="200" height="34"/><text class="t" x="120" y="130" text-anchor="middle">aliases</text>
  <rect class="def" x="20" y="152" width="200" height="34"/><text class="t" x="120" y="174" text-anchor="middle">properties</text>
  <rect class="def" x="56" y="196" width="164" height="34"/><text class="t" x="138" y="218" text-anchor="middle">property_aliases</text>
  <text class="n" x="120" y="242" text-anchor="middle">a property's own words</text>

  <rect class="def" x="20" y="258" width="200" height="34"/><text class="t" x="120" y="280" text-anchor="middle">jobs</text>
  <rect class="def" x="56" y="302" width="164" height="34"/><text class="t" x="138" y="324" text-anchor="middle">targets</text>
  <rect class="def" x="56" y="346" width="164" height="34"/><text class="t" x="138" y="368" text-anchor="middle">content_types</text>
  <text class="n" x="120" y="392" text-anchor="middle">where to look, and how far</text>

  <rect class="crawl" x="360" y="108" width="160" height="34"/><text class="t" x="440" y="130" text-anchor="middle">queue_items</text>
  <text class="n" x="440" y="152" text-anchor="middle">the frontier, leased</text>
  <rect class="crawl" x="360" y="166" width="160" height="34"/><text class="t" x="440" y="188" text-anchor="middle">urls</text>
  <rect class="crawl" x="396" y="210" width="124" height="34"/><text class="t" x="458" y="232" text-anchor="middle">responses</text>
  <rect class="crawl" x="360" y="254" width="160" height="34"/><text class="t" x="440" y="276" text-anchor="middle">page_roles</text>
  <text class="n" x="440" y="298" text-anchor="middle">what each URL is</text>
  <rect class="crawl" x="360" y="312" width="160" height="34"/><text class="t" x="440" y="334" text-anchor="middle">visits</text>

  <rect class="learn" x="660" y="108" width="200" height="34"/><text class="t" x="760" y="130" text-anchor="middle">rules</text>
  <rect class="learn" x="696" y="152" width="164" height="34"/><text class="t" x="778" y="174" text-anchor="middle">rules (children)</text>
  <text class="n" x="760" y="196" text-anchor="middle">parent locates the record,</text>
  <text class="n" x="760" y="208" text-anchor="middle">children pull its fields</text>
  <rect class="learn" x="660" y="222" width="200" height="34"/><text class="t" x="760" y="244" text-anchor="middle">records</text>
  <rect class="learn" x="696" y="266" width="164" height="34"/><text class="t" x="778" y="288" text-anchor="middle">values</text>
  <text class="n" x="760" y="310" text-anchor="middle">one row per property found</text>
  <rect class="learn" x="660" y="324" width="200" height="34"/><text class="t" x="760" y="346" text-anchor="middle">model_meta · chains</text>

  <path class="own" d="M370,44 H240 C226,44 220,52 220,66 V104"/>
  <path class="own" d="M440,58 V104"/>
  <path class="own" d="M510,44 H640 C654,44 660,52 660,66 V104"/>

  <path class="edge" d="M120,186 V196"/>
  <path class="edge" d="M120,292 V302"/>
  <path class="edge" d="M40,292 V363 H52"/>
  <path class="edge" d="M440,200 C470,200 458,204 458,206"/>
  <path class="edge" d="M760,142 V152"/>
  <path class="edge" d="M760,256 V266"/>

  <text class="n" x="440" y="422" text-anchor="middle">Targets and content types hang off a job, not the item: an item says what you are hunting and knows nothing about where it is.</text>
  <text class="n" x="440" y="440" text-anchor="middle">The frontier and the records stay keyed to the item, because two jobs hunting one item fill one queue and one table.</text>
  <text class="n" x="440" y="464" text-anchor="middle">Deleting an item cascades through all three columns: the definition, the crawl, and what was learned.</text>
  <text class="n" x="440" y="490" text-anchor="middle">hosts, cookies and judgements are shared across items: politeness and cached answers are owed to a site, not to one hunt.</text>
</svg>
