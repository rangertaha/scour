<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 334" role="img" aria-label="Per-field fill rates on two corpora.">
  <style>
    .lbl { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1f2328; }
    .pct { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #57606a; }
    .key { font: 11px -apple-system, system-ui, sans-serif; fill: #57606a; }
    .old { fill: #8c959f; }
    .new { fill: #0969da; }
    @media (prefers-color-scheme: dark) {
      .lbl { fill: #e6edf3; } .pct, .key { fill: #8b949e; }
      .old { fill: #6e7681; } .new { fill: #58a6ff; }
    }
  </style>
  <rect class="old" x="110" y="12" width="11" height="11" rx="2"/>
  <text class="key" x="128" y="22">19 sites, developed against</text>
  <rect class="new" x="310" y="12" width="11" height="11" rx="2"/>
  <text class="key" x="328" y="22">30 sites, never seen</text>
  <text class="lbl" x="98" y="53" text-anchor="end">title</text>
  <rect class="old" x="110" y="40" width="504.0" height="8" rx="2"/>
  <rect class="new" x="110" y="51" width="560.0" height="8" rx="2"/>
  <text class="pct" x="680" y="55">90% &#8594; 100%</text>
  <text class="lbl" x="98" y="87" text-anchor="end">link</text>
  <rect class="old" x="110" y="74" width="560.0" height="8" rx="2"/>
  <rect class="new" x="110" y="85" width="560.0" height="8" rx="2"/>
  <text class="pct" x="680" y="89">100% &#8594; 100%</text>
  <text class="lbl" x="98" y="121" text-anchor="end">summary</text>
  <rect class="old" x="110" y="108" width="369.6" height="8" rx="2"/>
  <rect class="new" x="110" y="119" width="504.0" height="8" rx="2"/>
  <text class="pct" x="623" y="123">66% &#8594; 90%</text>
  <text class="lbl" x="98" y="155" text-anchor="end">published</text>
  <rect class="old" x="110" y="142" width="196.0" height="8" rx="2"/>
  <rect class="new" x="110" y="153" width="425.6" height="8" rx="2"/>
  <text class="pct" x="545" y="157">35% &#8594; 76%</text>
  <text class="lbl" x="98" y="189" text-anchor="end">modified</text>
  <rect class="old" x="110" y="176" width="190.4" height="8" rx="2"/>
  <rect class="new" x="110" y="187" width="425.6" height="8" rx="2"/>
  <text class="pct" x="545" y="191">34% &#8594; 76%</text>
  <text class="lbl" x="98" y="223" text-anchor="end">author</text>
  <rect class="old" x="110" y="210" width="235.2" height="8" rx="2"/>
  <rect class="new" x="110" y="221" width="386.4" height="8" rx="2"/>
  <text class="pct" x="506" y="225">42% &#8594; 69%</text>
  <text class="lbl" x="98" y="257" text-anchor="end">section</text>
  <rect class="old" x="110" y="244" width="128.8" height="8" rx="2"/>
  <rect class="new" x="110" y="255" width="548.8" height="8" rx="2"/>
  <text class="pct" x="668" y="259">23% &#8594; 98%</text>
  <text class="key" x="110" y="316">share of records carrying a value, per field</text>
</svg>
