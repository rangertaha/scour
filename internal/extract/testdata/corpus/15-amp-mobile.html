  <h1>Two more weeks of roadworks on the ring road</h1>
  <time datetime="2026-04-20T05:45:00Z">20 Apr 2026</time>
  <p>The resurfacing of the eastern ring road will run a fortnight beyond the
  date first given, the county council has confirmed.</p>
  <p>Overnight closures continue between junctions four and six until the work
  is done.</p>
