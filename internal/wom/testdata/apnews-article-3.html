<script type="application/ld+json" id="link-ld-json">[{"@context":"http://schema.org","@type":"NewsArticle","url":"https://apnews.com/article/america-250-time-capsule-8d869f8aa39ef61a5721c039c397464e","dateModified":"2026-06-15T12:34:32Z","datePublished":"2026-06-15T12:34:32Z","description":"A 900-pound time capsule marking the 250th anniversary of American independence has been sealed shut and shipped to Philadelphia, where it will be buried next month. The 2016 law creating the nonpartisan America 250 commission mandated the creation of a time capsule to be buried on July 4, 2026, and opened 250 years later. The time capsule was built at the National Institute of Standards and Technology, with careful attention paid to ensuring it will be watertight and airtight. It includes submissions from the three branches of the federal government, all 50 states, the five U.S. territories and the District of Columbia. The commission publicly released the list of contents on Monday.","image":[{"@context":"http://schema.org","@type":"ImageObject","height":653,"thumbnailUrl":"https://dims.apnews.com/dims4/default/66409b9/2147483647/strip/false/crop/5085x3390+0+0/resize/980x653!/quality/90/?url=https%3A%2F%2Fassets.apnews.com%2F65%2F69%2Fa5fe8ac868325d98d78d7dad3a07%2F19a25c144f27457c8bb2e04b4b395e4c","url":"https://dims.apnews.com/dims4/default/66409b9/2147483647/strip/false/crop/5085x3390+0+0/resize/980x653!/quality/90/?url=https%3A%2F%2Fassets.apnews.com%2F65%2F69%2Fa5fe8ac868325d98d78d7dad3a07%2F19a25c144f27457c8bb2e04b4b395e4c","width":980}],"name":"America 250 Commission Seals 900-Pound Time Capsule for 2276 | AP News","mainEntityOfPage":{"primaryImageOfPage":{"@type":"ImageObject","url":"https://dims.apnews.com/dims4/default/66409b9/2147483647/strip/false/crop/5085x3390+0+0/resize/980x653!/quality/90/?url=https%3A%2F%2Fassets.apnews.com%2F65%2F69%2Fa5fe8ac868325d98d78d7dad3a07%2F19a25c144f27457c8bb2e04b4b395e4c","width":980,"height":653},"@type":"WebPage","@id":"https://ap
